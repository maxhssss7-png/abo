name: Build Ustadh Haider

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/abufatima/app app/src/main/res/xml app/src/main/res/mipmap app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          def runNumber = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")

          android {
              namespace 'com.abufatima.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.abufatima.app"
                  minSdk 21
                  targetSdk 34
                  versionCode runNumber
                  versionName "1." + runNumber
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_PATH"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias "abufatima"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
              implementation platform('com.google.firebase:firebase-bom:32.7.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
              implementation 'androidx.work:work-runtime:2.9.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
