                  bar.elevation = dpf(3)
                  bar.setPadding(dp(4), 0, dp(4), 0)
                  if (onBack != null) bar.addView(iconBtn("→", 22f, Color.WHITE, onBack))
                  else bar.addView(iconBtn("☰", 22f, Color.WHITE) { openDrawer() })
