              private fun onImagePicked(uri: Uri) {
                  try {
                      val bounds = BitmapFactory.Options()
                      bounds.inJustDecodeBounds = true
                      contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                      var sample = 1
                      while (bounds.outWidth / sample > 1024 || bounds.outHeight / sample > 1024) sample *= 2
                      val opts = BitmapFactory.Options()
                      opts.inSampleSize = sample
                      val src = contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) } ?: return
                      val side = minOf(src.width, src.height)
                      val square = Bitmap.createBitmap(src, (src.width - side) / 2, (src.height - side) / 2, side, side)
                      val small = Bitmap.createScaledBitmap(square, 256, 256, true)
                      val out = ByteArrayOutputStream()
                      small.compress(Bitmap.CompressFormat.JPEG, 75, out)
                      pickedPhoto = Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP)
                      editAvatarHolder?.let {
                          it.removeAllViews()
                          it.addView(avatar(90, pickedPhoto, profName))
                      }
                  } catch (e: Exception) {
                      toast("تعذّر قراءة الصورة")
                  }
              }

