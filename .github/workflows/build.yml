                  db = FirebaseFirestore.getInstance(app)

                  val androidId = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "00000000"
                  deviceCode = androidId.padEnd(8, '0').take(8).uppercase()

                  showMessage("جارٍ التحميل…")

                  val current = auth.currentUser
                  if (current != null) {
                      onSignedIn(current.uid)
                  } else {
                      auth.signInAnonymously()
                          .addOnSuccessListener { res -> onSignedIn(res.user?.uid ?: "") }
                          .addOnFailureListener { e ->
                              showMessage("تعذّر الاتصال. تأكد من الإنترنت ثم أعد فتح التطبيق.\n\n" + (e.message ?: ""))
                          }
                  }

                  PostsWorker.ensureChannel(this)
                  PostsWorker.schedule(this)
                  checkForUpdate()
              }

              override fun onResume() {
                  super.onResume()
                  val u = pendingUpdateUrl
                  if (u != null && canInstall()) {
                      pendingUpdateUrl = null
                      downloadUpdate(u)
                  }
                  handler.removeCallbacks(heartbeat)
                  if (started) handler.post(heartbeat)
              }

              override fun onPause() {
                  super.onPause()
                  handler.removeCallbacks(heartbeat)
              }

              private fun onSignedIn(id: String) {
                  uid = id
                  val ref = db.collection("codes").document(deviceCode)
                  ref.get()
                      .addOnSuccessListener { snap ->
                          if (!snap.exists()) {
                              ref.set(mapOf("uid" to uid, "at" to FieldValue.serverTimestamp()))
                                  .addOnCompleteListener { watchRole() }
                          } else {
                              linkProblem = snap.getString("uid") != uid
                              watchRole()
                          }
                      }
                      .addOnFailureListener { watchRole() }
              }

              private fun watchRole() {
                  if (deviceCode == Fb.DEV_CODE && !linkProblem) {
                      role = "developer"
                      start()
                      return
                  }
                  db.collection("roles").document(uid).addSnapshotListener { snap, _ ->
                      val newRole = if (snap != null && snap.getString("role") == "teacher") "teacher" else "parent"
                      val changed = newRole != role
                      role = newRole
                      if (!started) {
                          start()
                      } else if (changed) {
                          prefs.edit().putBoolean("staff", isStaff).apply()
                          attachData()
                          goHome()
                      }
                  }
              }

              private fun start() {
                  if (started) return
                  started = true
                  prefs.edit().putBoolean("staff", isStaff).apply()
                  db.collection("profile").document("main").addSnapshotListener { snap, _ ->
                      if (snap != null && snap.exists()) {
                          profName = snap.getString("name")?.takeIf { it.isNotBlank() } ?: Fb.APP_NAME
                          profBio = snap.getString("bio") ?: ""
                          profPhoto = snap.getString("photo")
                          profVerified = snap.getBoolean("verified") ?: false
                      }
                      onProfile?.invoke()
                  }
                  attachData()
                  goHome()
                  handler.removeCallbacks(heartbeat)
                  handler.post(heartbeat)
                  if (!isStaff && Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      askNotify.launch(Manifest.permission.POST_NOTIFICATIONS)
                  }
              }

              private fun visibleSections(): List<Section> =
                  if (isStaff) Fb.SECTIONS else Fb.SECTIONS.filter { it.id == mySection }

              private fun attachData() {
                  for (r in dataRegs) r.remove()
                  dataRegs.clear()
                  posts.clear()
                  pins.clear()
                  for (s in visibleSections()) {
                      val sid = s.id
                      dataRegs.add(
                          db.collection("sections").document(sid).collection("posts")
                              .orderBy("createdAt", Query.Direction.DESCENDING)
                              .limit(50)
                              .addSnapshotListener { snap, _ ->
                                  if (snap != null) {
                                      posts[sid] = snap.documents.reversed()
                                      onData?.invoke()
                                  }
                              }
                      )
                      dataRegs.add(
                          db.collection("sections").document(sid).addSnapshotListener { snap, _ ->
                              val t = snap?.getString("pinText")
                              val id = snap?.getString("pinId")
                              pins[sid] = if (!t.isNullOrBlank() && id != null) Pair(t, id) else null
                              onData?.invoke()
                          }
                      )
                  }
              }

              private fun sendHeartbeat() {
                  val sid = mySection ?: return
                  if (!started || isStaff || uid.isEmpty()) return
                  db.collection("members").document(uid)
                      .set(mapOf("section" to sid, "seen_$sid" to FieldValue.serverTimestamp()))
              }

              private fun goHome() {
                  if (!isStaff && mySection == null) showPick() else showList()
              }

