              private fun sectionAvatar(s: Section, size: Int): TextView {
                  val a = tv(s.short, size / 2.9f, Color.WHITE, true)
                  a.gravity = Gravity.CENTER
                  a.background = oval(s.color)
                  a.layoutParams = LinearLayout.LayoutParams(dp(size), dp(size))
                  return a
              }

              private fun decodePhoto(b64: String?): Bitmap? {
                  if (b64.isNullOrBlank()) return null
                  return try {
                      val bytes = android.util.Base64.decode(b64, android.util.Base64.DEFAULT)
                      BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun teacherAvatar(size: Int, photo: String? = profPhoto): View {
                  val iv = ImageView(this)
                  val bmp = decodePhoto(photo)
                  if (bmp != null) {
                      val rd = RoundedBitmapDrawableFactory.create(resources, bmp)
                      rd.isCircular = true
                      iv.setImageDrawable(rd)
                  } else {
                      iv.setImageResource(R.drawable.logo_circle)
                  }
                  iv.scaleType = ImageView.ScaleType.CENTER_CROP
                  iv.layoutParams = LinearLayout.LayoutParams(dp(size), dp(size))
                  return iv
              }

              private fun verifiedBadge(bg: Int, fg: Int, size: Int = 17): TextView {
                  val b = tv("✓", size * 0.6f, fg, true)
                  b.gravity = Gravity.CENTER
                  b.background = oval(bg)
                  b.includeFontPadding = false
                  val p = LinearLayout.LayoutParams(dp(size), dp(size))
                  p.marginStart = dp(5)
                  b.layoutParams = p
                  return b
              }

              private fun nameWithBadge(size: Float, color: Int, badgeBg: Int, badgeFg: Int): LinearLayout {
                  val row = hbox()
                  val n = tv(profName, size, color, true)
                  n.setSingleLine(true)
