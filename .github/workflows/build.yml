              private fun chooseSection(sid: String) {
                  val old = mySection
                  prefs.edit().putString("section", sid).apply()
                  if (old != sid) {
                      prefs.edit().putLong("read_$sid", System.currentTimeMillis()).putLong("notified_$sid", System.currentTimeMillis()).apply()
                      sendHeartbeat()
                      attachData()
                  }
                  openChat(sid)
              }

