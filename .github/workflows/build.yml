<script>
var SECTIONS = [
  {id:'s4',  name:'الصف الرابع',     short:'٤',  cls:'c4',  members:31},
  {id:'s5a', name:'الخامس - أ',      short:'٥أ', cls:'c5a', members:28},
  {id:'s5b', name:'الخامس - ب',      short:'٥ب', cls:'c5b', members:26},
  {id:'s6a', name:'السادس - أ',      short:'٦أ', cls:'c6a', members:29},
  {id:'s6b', name:'السادس - ب',      short:'٦ب', cls:'c6b', members:27}
];
var POSTS = {
  s4:[
    {day:'أمس', time:'٧:٤٠ م', views:29, text:'السلام عليكم، واجب الرياضيات: تمارين صفحة ٢٢ كاملة في دفتر الواجبات.'},
    {day:'اليوم', time:'٨:١٥ م', views:24, img:'القراءة — الدرس الثالث\nحل الأسئلة ١ ، ٢ ، ٣\nحفظ النشيد', text:'واجب القراءة لليوم، مع حفظ النشيد للغد.'}
  ],
  s5a:[
    {day:'أمس', time:'٦:٠٥ م', views:27, text:'تذكير: الاختبار القصير في العلوم يوم الخميس، الفصل الثاني.'},
    {day:'اليوم', time:'٧:٣٠ م', views:21, img:'الإسلامية\nحفظ سورة الضحى\nتفسير الكلمات', text:'حفظ سورة الضحى وتفسير الكلمات الصعبة.'},
    {day:'اليوم', time:'٨:٠٢ م', views:18, text:'واجب الإنكليزي: كتابة الكلمات الجديدة ٣ مرات، صفحة ١٤.'}
  ],
  s5b:[{day:'اليوم', time:'٧:٥٠ م', views:22, text:'قراءة درس (الوطن) وتلخيصه بخمسة أسطر، مع جلب القاموس غداً.'}],
  s6a:[{day:'اليوم', time:'٦:٤٠ م', views:25, text:'حل أسئلة نهاية الفصل الثاني، علوم، صفحة ٣٠-٣١.'}],
  s6b:[{day:'أمس', time:'٩:١٠ م', views:26, text:'مراجعة قواعد اللغة العربية (الفعل المضارع) استعداداً للاختبار.'}]
};
var NAMES = ['أحمد علي','زهراء حسين','محمد جاسم','فاطمة كريم','حسن عباس','مريم ستار','علي رعد','نور الهدى سالم','يوسف ماجد','رقية حيدر','عبدالله فاضل','سجى مهدي','كرار صادق','زينب قاسم','مصطفى نعمان','آية رحيم'];
var ONLINE = {s4:4, s5a:5, s5b:3, s6a:6, s6b:2};
var LASTSEEN = ['متصل الآن','متصل الآن','متصل الآن','متصل الآن','متصل الآن','آخر ظهور قبل ١٠ دقائق','آخر ظهور قبل ساعة','آخر ظهور اليوم ٤:٢٠ م','آخر ظهور أمس','آخر ظهور أمس','آخر ظهور قبل يومين','آخر ظهور قبل ٣ أيام','آخر ظهور قبل ٣ أيام','آخر ظهور قبل أسبوع','آخر ظهور قبل أسبوع','آخر ظهور قبل أسبوع'];
var VTIMES = ['٨:٠٣ م','٨:٠٥ م','٨:٠٩ م','٨:١٤ م','٨:٢٠ م','٨:٣١ م','٨:٤٠ م','٩:٠٢ م','٩:١٥ م','٩:٤٤ م','١٠:٠١ م','١٠:٢٢ م','١٠:٣٠ م','١٠:٥٥ م','١١:١٠ م','١١:٣٠ م','١١:٤٥ م','١١:٥٠ م'];
var studentName = '';
var PINNED = {s4:'جدول الامتحانات الشهرية — يرجى الاطلاع', s5a:'جدول الامتحانات الشهرية — يرجى الاطلاع', s5b:'جدول الامتحانات الشهرية — يرجى الاطلاع', s6a:'جدول الامتحانات الشهرية — يرجى الاطلاع', s6b:'جدول الامتحانات الشهرية — يرجى الاطلاع'};
var UNREAD = {s4:1, s5a:2, s5b:0, s6a:1, s6b:0};

var role = 'parent';
var mySection = null;
var current = null;
var verified = true;
var ctxIndex = -1;

function $(id){return document.getElementById(id)}
function sec(id){for(var i=0;i<SECTIONS.length;i++) if(SECTIONS[i].id===id) return SECTIONS[i];}
function staff(){return role==='teacher'||role==='dev'}
function go(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on')});
  $(id).classList.add('on');
}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on')},2000)}
function shareApp(){toast('تفتح قائمة المشاركة ويُرسل ملف التطبيق نفسه')}
function toggleSw(id){$(id).classList.toggle('on')}

var CHAN_ICO = '<svg class="chanico" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h4l6 4V6L7 10z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>';
var VBADGE = '<svg class="vbadge" viewBox="0 0 24 24"><path d="M12 2.5 14.6 5l3.5-.6 1 3.4 3 1.9-1.6 3.1 1.6 3.1-3 1.9-1 3.4-3.5-.6L12 23l-2.6-2.5-3.5.6-1-3.4-3-1.9 1.6-3.1-1.6-3.1 3-1.9 1-3.4 3.5.6z" fill="#4ca3e0"/><path d="m8.5 12.3 2.4 2.4 4.6-5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var VBADGE_W = VBADGE.replace('#4ca3e0','#fff').replace('stroke="#fff"','stroke="#517da2"');

function renderBadges(){
  document.querySelectorAll('.vb').forEach(function(e){e.innerHTML = verified ? VBADGE_W : ''});
}

/* ---------- picker ---------- */
function renderPick(){
  $('pickList').innerHTML = SECTIONS.map(function(s){
    return '<div class="row" onclick="pickSection(\''+s.id+'\')">'+
      '<div class="av av54 '+s.cls+'">'+s.short+'</div>'+
      '<div class="mid"><div class="l1"><div class="name">'+s.name+'</div></div>'+
      '<div class="l2"><div class="prev">'+s.members+' عضو</div></div></div></div>';
  }).join('');
}
function pickSection(id){
  var n = $('studentName').value.trim();
  if(!n && !staff()){ $('nameErr').style.display='block'; $('studentName').focus(); return }
  if(n) studentName = n;
  $('nameErr').style.display='none';
  mySection = id;
  try{localStorage.setItem('af_tg_section', id)}catch(e){}
  renderList(); renderDrawer();
  openChat(id);
}
function renameStudent(){
  var n = prompt('اسم الطالب', studentName);
  if(n && n.trim()){ studentName=n.trim(); renderSettings(); renderDrawer(); toast('تم تعديل الاسم') }
}
function renderSettings(){
  $('setName').textContent = studentName || '—';
  $('mySection').textContent = mySection ? sec(mySection).name : '';
}
function changeSection(){
  $('studentName').value = studentName;
  mySection = null;
  try{localStorage.removeItem('af_tg_section')}catch(e){}
  go('s-pick');
}

/* ---------- chat list ---------- */
function lastOf(id){var p=POSTS[id];return p[p.length-1]}
function renderList(){
  var list = staff() ? SECTIONS : SECTIONS.filter(function(s){return s.id===mySection});
  $('chatList').innerHTML = list.map(function(s){
    var last = lastOf(s.id);
    var prev = last.img ? '<b>صورة،</b> '+last.text : last.text;
    var u = UNREAD[s.id];
    return '<div class="row" onclick="openChat(\''+s.id+'\')">'+
      '<div class="av av54 '+s.cls+'">'+s.short+'</div>'+
      '<div class="mid"><div class="l1"><div class="name">'+CHAN_ICO+s.name+'</div><div class="time">'+last.time+'</div></div>'+
      '<div class="l2"><div class="prev">'+prev+'</div>'+(u?'<div class="badge">'+u+'</div>':'')+'</div></div></div>';
  }).join('') + (staff() ? '' : '<div class="hintsub" style="text-align:center;padding-top:18px">تصلك هنا واجبات صفّك فقط</div>');
  renderSettings();
}

/* ---------- chat ---------- */
function openChat(id){
  current = id;
  UNREAD[id] = 0;
  var s = sec(id);
  $('chatAv').className = 'av av42 '+s.cls; $('chatAv').textContent = s.short;
  $('chatTitle').textContent = s.name;
  $('chatSub').innerHTML = s.members+' عضو، <span style="color:#fff;font-weight:600">'+ONLINE[id]+' متصل</span>';
  $('pinnedText').textContent = PINNED[id];
  $('infoAv').className = 'av av64 '+s.cls; $('infoAv').textContent = s.short;
  $('infoName').textContent = s.name;
  $('infoSub').textContent = s.members+' عضو، '+ONLINE[id]+' متصل';
  $('infoDesc').textContent = 'مجموعة واجبات '+s.name+' الابتدائي.';
  renderInfoTabs(staff() ? 'members' : 'media');
  renderMessages();
  renderBottom();
  renderList();
  go('s-chat');
}
function renderMessages(){
  var posts = POSTS[current], html='', lastDay='';
  posts.forEach(function(p,i){
    if(p.day!==lastDay){html+='<div class="datepill">'+p.day+'</div>';lastDay=p.day}
    html += '<div class="msg"><div class="bubble" onclick="openCtx('+i+')">'+
      '<div class="who">'+$('editName').value+(verified?VBADGE:'')+'</div>'+
      (p.img?'<div class="hwimg" style="margin-top:6px"><div class="hand">'+p.img.replace(/\n/g,'<br>')+'</div></div>':'')+
      '<div class="txt">'+p.text+'</div>'+
      '<div class="meta"><span>'+p.time+(p.edited?' · معدّلة':'')+'</span><span class="eye" onclick="event.stopPropagation();openViews('+i+')"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg>'+p.views+'</span></div>'+
      '</div></div>';
  });
  $('chatBody').innerHTML = html;
  $('chatBody').scrollTop = 1e6;
}
var muted = false;
function renderBottom(){
  if(staff()){
    $('chatBottom').innerHTML =
      '<div class="gradetag">تنشر إلى: '+sec(current).name+'</div>'+
      '<div class="inputbar">'+
      '<button class="ib" onclick="toast(\'إرفاق صورة من المعرض أو الكاميرا\')"><svg viewBox="0 0 24 24"><path d="m20.5 11.5-8.3 8.3a5 5 0 0 1-7-7l8.3-8.3a3.3 3.3 0 0 1 4.7 4.7l-8.3 8.3a1.7 1.7 0 0 1-2.4-2.4l7.6-7.6"/></svg></button>'+
      '<textarea class="field" id="msgField" rows="1" placeholder="اكتب الواجب…"></textarea>'+
      '<button class="ib send" onclick="sendPost()"><svg viewBox="0 0 24 24"><path d="M3 11.5 21 4l-7.5 18-2.5-7.5z"/><path d="m11 14.5 4-4"/></svg></button>'+
      '</div>';
  } else {
    $('chatBottom').innerHTML = '<button class="mutebar" style="width:100%" onclick="toggleMute()">'+(muted?'إلغاء الكتم':'كتم الإشعارات')+'</button>';
  }
}
function toggleMute(){muted=!muted;renderBottom();toast(muted?'تم كتم الإشعارات':'تم تفعيل الإشعارات')}
function sendPost(){
  var t = $('msgField').value.trim();
  if(!t){toast('اكتب نص الواجب أولاً');return}
  POSTS[current].push({day:'اليوم', time:'الآن', views:0, text:t});
  renderMessages(); renderList();
  $('msgField').value='';
  toast('أُرسل الواجب وتنبّه أهالي '+sec(current).name);
}

/* ---------- context menu (staff) ---------- */
function openCtx(i){ if(!staff()) return; ctxIndex=i; $('ctxViews').textContent='👁 شاهدها '+POSTS[current][i].views+' — عرض الأسماء'; $('ctx').classList.add('on') }
function openViews(i){
  if(!staff()) return;
  var p = POSTS[current][i], s = sec(current);
  var seen = Math.min(p.views, NAMES.length);
  var html = '<div class="listsec">شاهدها ('+p.views+')</div><div class="sect" style="margin:0">';
  for(var k=0;k<seen;k++) html += memberRow(NAMES[k], 'شاهدها '+p.day+' '+VTIMES[k], false);
  html += '</div>';
  var notSeen = NAMES.slice(seen, seen+4);
  if(notSeen.length){
    html += '<div class="listsec">لم يشاهدها بعد ('+(s.members-p.views)+')</div><div class="sect" style="margin:0">';
    notSeen.forEach(function(n,k){ html += memberRow(n, LASTSEEN[seen+k] || 'آخر ظهور قبل أسبوع', false) });
    html += '</div>';
  }
  $('viewsTitle').textContent = 'المشاهدات · '+s.name;
  $('viewsBody').innerHTML = html;
  go('s-views');
}
function memberRow(name, sub, online){
  var colors=['c4','c5a','c5b','c6a','c6b'];
  var c = colors[name.length % 5];
  return '<div class="row" style="padding:7px 14px"><div class="avwrap"><div class="av av42 '+c+'">'+name.trim().charAt(0)+'</div>'+(online?'<span class="dot"></span>':'')+'</div>'+
    '<div class="mid" style="padding:4px 0 8px"><div class="l1"><div class="name" style="font-size:15.5px">'+name+'</div></div>'+
    '<div class="l2"><div class="prev'+(online?' online':'')+'" style="font-size:13.5px">'+sub+'</div></div></div></div>';
}
function renderInfoTabs(tab){
  var tabs = staff() ? [['members','الأعضاء'],['media','الصور']] : [['media','الصور']];
  $('infoTabs').innerHTML = tabs.map(function(t){return '<div class="'+(t[0]===tab?'on':'')+'" onclick="renderInfoTabs(\''+t[0]+'\')">'+t[1]+'</div>'}).join('');
  if(tab==='members'){
    var s = sec(current);
    $('infoTabBody').innerHTML = NAMES.map(function(n,k){ return memberRow(n, LASTSEEN[k], k<ONLINE[current]) }).join('') +
      '<div class="fnote" style="padding:10px 18px 16px">و'+(s.members-NAMES.length)+' عضواً آخرين…</div>';
  } else {
    $('infoTabBody').innerHTML = '<div class="mediagrid"><div></div><div></div><div></div><div></div><div></div></div>';
  }
}
function closeCtx(e){ if(e.target.id==='ctx') $('ctx').classList.remove('on') }
function ctxAct(a){
  $('ctx').classList.remove('on');
  var p = POSTS[current][ctxIndex];
  if(a==='del'){ POSTS[current].splice(ctxIndex,1); renderMessages(); renderList(); toast('حُذف الواجب') }
  if(a==='pin'){ PINNED[current]=p.text; $('pinnedText').textContent=p.text; toast('تم تثبيت الرسالة') }
  if(a==='copy'){ toast('تم نسخ النص') }
  if(a==='views'){ openViews(ctxIndex) }
  if(a==='edit'){ var n = prompt('تعديل الواجب', p.text); if(n){p.text=n;p.edited=true;renderMessages();renderList()} }
}

/* ---------- drawer ---------- */
function openDrawer(){ $('scrim').classList.add('on'); $('drawer').classList.add('on') }
function closeDrawer(){ $('scrim').classList.remove('on'); $('drawer').classList.remove('on') }
function renderDrawer(){
  var html='';
  if(staff()){
    html += '<div class="dsep"></div>'+
      '<button class="ditem" onclick="closeDrawer();go(\'s-edit\')"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>تعديل الملف الشخصي</button>';
    if(role==='dev') html += '<button class="ditem" onclick="closeDrawer();renderGrant();go(\'s-grant\')"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/></svg>صلاحيات الأساتذة</button>';
  }
  $('staffItems').innerHTML = html;
  $('drawerRole').textContent = staff() ? 'كل الشعب' : (studentName ? studentName+' · ' : '')+(mySection?sec(mySection).name:'');
  $('dChange').style.display = staff() ? 'none' : '';
}

/* ---------- edit profile ---------- */
function toggleVerified(){
  if(role!=='dev'){ toast('علامة التوثيق يمنحها المطوّر فقط'); return }
  verified=!verified; $('swVer').classList.toggle('on',verified); renderBadges();
}
function saveProfile(){
  var n=$('editName').value.trim()||'أستاذ حيدر';
  document.querySelectorAll('.tname').forEach(function(e){e.textContent=n});
  $('editBio').value && document.querySelectorAll('.tbio').forEach(function(e){e.textContent=$('editBio').value});
  toast('حُفظ الملف الشخصي'); go('s-list');
}
function renderEdit(){
  $('verNote').textContent = role==='dev' ? 'أنت المطوّر، يمكنك تفعيلها أو إلغاؤها' : 'يمنحها المطوّر فقط';
  $('verRow').style.opacity = role==='dev' ? 1 : .55;
  $('swVer').classList.toggle('on',verified);
}

/* ---------- grant (dev) ---------- */
var TEACHERS = ['AF2217C9'];
function renderGrant(){
  $('grantList').innerHTML = TEACHERS.length ? TEACHERS.map(function(c,i){
    return '<div class="setrow"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/></svg>'+
      '<div class="sv"><div class="s1" style="direction:ltr;text-align:right">'+c+'</div><div class="s2">أستاذ</div></div>'+
      '<button class="revoke" onclick="revoke('+i+')">سحب</button></div>';
  }).join('') : '<div class="fnote" style="padding:14px 18px">لا يوجد أساتذة بعد</div>';
}
function grant(){
  var c=$('grantInput').value.trim().toUpperCase();
  if(c.length!==8){toast('المعرّف ٨ حروف وأرقام');return}
  TEACHERS.push(c); $('grantInput').value=''; renderGrant(); toast('مُنحت صلاحية الأستاذ لهذا الجهاز');
}
function revoke(i){ TEACHERS.splice(i,1); renderGrant(); toast('سُحبت الصلاحية') }

/* ---------- role (preview only) ---------- */
function setRole(r){
  role=r;
  ['parent','teacher','dev'].forEach(function(x){$('r-'+x).classList.toggle('on',x===r)});
  renderList(); renderDrawer(); renderEdit();
  if(staff()){
    if(!mySection) mySection='s5a';
    go('s-list');
  } else if(!mySection){
    go('s-pick');
  } else {
    go('s-list');
  }
  if(current && $('s-chat').classList.contains('on')){renderBottom()}
}

/* ---------- start ---------- */
renderPick(); renderBadges();
try{ mySection = localStorage.getItem('af_tg_section') }catch(e){}
setRole('parent');
if(mySection) openChat(mySection);
</script>
</body>
</html>
