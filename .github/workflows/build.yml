              private fun showGrant() {
                  if (!isDev) {
                      goHome()
                      return
                  }
                  val pg = page()
                  pg.addView(topBar("صلاحيات الأساتذة", { goHome() }))
                  val body = vbox()
                  body.setBackgroundColor(SOFT)

                  val box = vbox()
                  box.setBackgroundColor(Color.WHITE)
                  box.setPadding(dp(18), dp(14), dp(18), dp(16))
                  box.addView(tv("معرّف جهاز الأستاذ", 13.5f, ACCENT, true))
                  val code = EditText(this)
                  code.hint = "مثال: 229FB7F5"
                  code.setSingleLine(true)
                  code.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_CHARACTERS
                  box.addView(code, mw())
                  box.addView(tv("يجده صاحب الجهاز في الإعدادات ← حول التطبيق.", 13f, SUB), mw(top = 4))
                  val grant = tv("منح صلاحية الأستاذ", 15.5f, Color.WHITE, true)
                  grant.gravity = Gravity.CENTER
                  grant.background = shape(Color.parseColor("#5AA0D8"), 8)
                  grant.setPadding(0, dp(13), 0, dp(13))
                  box.addView(grant, mw(top = 16))
                  val relink = tv("إعادة ربط هذا المعرّف (إذا حذف صاحبه التطبيق وثبّته من جديد)", 13f, ACCENT)
                  relink.gravity = Gravity.CENTER
                  relink.setPadding(0, dp(12), 0, 0)
                  box.addView(relink, mw())
                  body.addView(box)
                  body.addView(gap())

                  val listBox = vbox()
                  listBox.setBackgroundColor(Color.WHITE)
                  listBox.addView(sectionTitle("الأساتذة الحاليون"))
                  val list = vbox()
                  listBox.addView(list)
                  body.addView(listBox)

                  grant.setOnClickListener {
                      val c = code.text.toString().trim().uppercase()
                      if (c.length != 8) {
                          toast("المعرّف يتكون من 8 حروف وأرقام")
                          return@setOnClickListener
                      }
                      if (c == Fb.DEV_CODE) {
                          toast("هذا جهازك، صلاحياته كاملة أصلاً")
                          return@setOnClickListener
                      }
                      db.collection("codes").document(c).get()
                          .addOnSuccessListener { snap ->
                              val target = snap.getString("uid")
                              if (!snap.exists() || target == null) {
                                  toast("لم يُعثر على هذا المعرّف. اطلب من صاحب الجهاز فتح التطبيق مرة واحدة على الأقل.")
                              } else {
                                  db.collection("roles").document(target)
                                      .set(mapOf("role" to "teacher", "code" to c))
                                      .addOnSuccessListener {
                                          code.setText("")
                                          toast("تم منح صلاحية الأستاذ ✅")
                                      }
                                      .addOnFailureListener { e -> toast("فشل المنح: " + (e.message ?: "")) }
                              }
                          }
                          .addOnFailureListener { e -> toast("فشل البحث: " + (e.message ?: "")) }
                  }
                  relink.setOnClickListener {
                      val c = code.text.toString().trim().uppercase()
                      if (c.length != 8) {
                          toast("اكتب المعرّف أولاً")
                          return@setOnClickListener
                      }
                      db.collection("codes").document(c).delete()
                          .addOnSuccessListener { toast("تم. يفتح صاحب الجهاز التطبيق من جديد، ثم امنحه الصلاحية مرة أخرى.") }
                          .addOnFailureListener { e -> toast("فشل: " + (e.message ?: "")) }
                  }

                  pg.addView(scroller(body, SOFT), fill())
                  setScreen(pg, { goHome() })

                  rolesReg = db.collection("roles").addSnapshotListener { snap, err ->
                      list.removeAllViews()
                      if (err != null || snap == null) {
                          val e = tv("تعذّر تحميل القائمة", 13f, RED)
                          e.setPadding(dp(18), dp(10), dp(18), dp(14))
                          list.addView(e)
                          return@addSnapshotListener
                      }
                      val docs = snap.documents.filter { it.getString("role") == "teacher" }
                      if (docs.isEmpty()) {
                          val e = tv("لا يوجد أساتذة بعد", 13f, SUB)
                          e.setPadding(dp(18), dp(10), dp(18), dp(14))
                          list.addView(e)
                      }
                      for (d in docs) {
                          val revoke = tv("سحب", 14f, RED, true)
                          val row = setRow("👤", d.getString("code") ?: d.id.take(8), "أستاذ", right = revoke)
                          revoke.setOnClickListener {
                              AlertDialog.Builder(this)
                                  .setMessage("سحب صلاحية الأستاذ من هذا الجهاز؟")
                                  .setPositiveButton("سحب") { _, _ ->
                                      d.reference.delete().addOnSuccessListener { toast("تم سحب الصلاحية") }
                                  }
                                  .setNegativeButton("إلغاء", null)
                                  .show()
                          }
                          list.addView(row)
                          list.addView(divider())
                      }
                  }
              }

              // ============================================================
              // share
              // ============================================================

              private fun shareApp() {
                  try {
                      val src = File(applicationInfo.sourceDir)
                      val dir = File(cacheDir, "share")
                      dir.mkdirs()
                      val out = File(dir, "UstadhHaider.apk")
                      src.copyTo(out, overwrite = true)
                      val uri = FileProvider.getUriForFile(this, "$packageName.files", out)
                      val i = Intent(Intent.ACTION_SEND)
                      i.type = "application/vnd.android.package-archive"
                      i.putExtra(Intent.EXTRA_STREAM, uri)
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      startActivity(Intent.createChooser(i, "مشاركة تطبيق " + Fb.APP_NAME))
                  } catch (e: Exception) {
                      toast("تعذّرت المشاركة: " + (e.message ?: ""))
                  }
              }

              // ============================================================
              // self update
              // ============================================================

              private fun canInstall(): Boolean =
                  Build.VERSION.SDK_INT < 26 || packageManager.canRequestPackageInstalls()

              private fun checkForUpdate() {
                  Thread {
                      try {
                          val conn = URL("https://api.github.com/repos/${Fb.REPO}/releases/latest").openConnection() as HttpURLConnection
                          conn.connectTimeout = 10000
                          conn.readTimeout = 10000
                          conn.setRequestProperty("Accept", "application/vnd.github+json")
                          if (conn.responseCode != 200) return@Thread
                          val json = JSONObject(conn.inputStream.bufferedReader().readText())
                          val latest = json.getString("tag_name").removePrefix("v").toLongOrNull() ?: return@Thread
                          val assets = json.getJSONArray("assets")
                          var apkUrl: String? = null
                          for (i in 0 until assets.length()) {
                              val a = assets.getJSONObject(i)
                              if (a.getString("name").endsWith(".apk")) apkUrl = a.getString("browser_download_url")
                          }
                          val current = PackageInfoCompat.getLongVersionCode(packageManager.getPackageInfo(packageName, 0))
                          val url = apkUrl
                          if (url != null && latest > current) {
                              runOnUiThread {
                                  if (!isFinishing) {
                                      AlertDialog.Builder(this)
                                          .setTitle("يتوفر تحديث جديد")
                                          .setMessage("توجد نسخة أحدث من التطبيق. هل تريد التحديث الآن؟")
                                          .setPositiveButton("تحديث الآن") { _, _ -> downloadUpdate(url) }
                                          .setNegativeButton("لاحقاً", null)
                                          .show()
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          // offline or GitHub unreachable
                      }
                  }.start()
              }

