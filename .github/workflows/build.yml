              private fun showPick() {
                  val pg = page()
                  pg.addView(topBar(Fb.APP_NAME, if (mySection != null || isStaff) ({ showList() }) else null))
                  val body = vbox()
                  body.addView(sectionTitle("اختر الشعبة"))
                  val hint = tv("ستصلك واجبات هذه الشعبة فقط. يمكنك تغييرها لاحقاً من الإعدادات.", 13f, SUB)
                  hint.setPadding(dp(18), 0, dp(18), dp(10))
