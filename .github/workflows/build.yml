              // ===================== share =====================

              private fun shareApp() {
                  try {
                      val src = File(applicationInfo.sourceDir)
                      val dir = File(cacheDir, "share")
                      dir.mkdirs()
                      val out = File(dir, "abufatima.apk")
                      src.copyTo(out, overwrite = true)
                      val uri = FileProvider.getUriForFile(this, "$packageName.files", out)
                      val i = Intent(Intent.ACTION_SEND)
                      i.type = "application/vnd.android.package-archive"
                      i.putExtra(Intent.EXTRA_STREAM, uri)
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      startActivity(Intent.createChooser(i, "مشاركة تطبيق ابو فاطمة"))
                  } catch (e: Exception) {
                      toast("تعذّرت المشاركة: " + (e.message ?: ""))
                  }
              }

              // ===================== self update =====================

              private fun canInstall(): Boolean =
                  Build.VERSION.SDK_INT < 26 || packageManager.canRequestPackageInstalls()

              private fun checkForUpdate() {
                  Thread {
                      try {
                          val conn = URL("https://api.github.com/repos/$REPO/releases/latest").openConnection() as HttpURLConnection
                          conn.connectTimeout = 10000
                          conn.readTimeout = 10000
                          conn.setRequestProperty("Accept", "application/vnd.github+json")
                          if (conn.responseCode != 200) return@Thread
                          val json = JSONObject(conn.inputStream.bufferedReader().readText())
                          val latest = json.getString("tag_name").removePrefix("v").toLongOrNull() ?: return@Thread
                          val assets = json.getJSONArray("assets")
                          var apkUrl: String? = null
                          for (i in 0 until assets.length()) {
                              val a = assets.getJSONObject(i)
                              if (a.getString("name").endsWith(".apk")) apkUrl = a.getString("browser_download_url")
                          }
                          val current = PackageInfoCompat.getLongVersionCode(packageManager.getPackageInfo(packageName, 0))
                          val url = apkUrl
                          if (url != null && latest > current) {
                              runOnUiThread {
                                  if (!isFinishing) {
                                      AlertDialog.Builder(this)
                                          .setTitle("يتوفر تحديث جديد")
                                          .setMessage("توجد نسخة أحدث من التطبيق. هل تريد التحديث الآن؟")
                                          .setPositiveButton("تحديث الآن") { _, _ -> downloadUpdate(url) }
                                          .setNegativeButton("لاحقاً", null)
                                          .show()
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          // no internet or GitHub unreachable: ignore silently
                      }
                  }.start()
              }

              private fun downloadUpdate(url: String) {
                  if (!canInstall()) {
                      pendingUpdateUrl = url
                      toast("اسمح لتطبيق ابو فاطمة بتثبيت التحديثات، ثم ارجع للتطبيق")
                      try {
                          startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName")))
                      } catch (e: Exception) {
                          toast("افتح الإعدادات واسمح بتثبيت التطبيقات من مصادر غير معروفة")
                      }
                      return
                  }
                  val dlg = AlertDialog.Builder(this)
                      .setMessage("جارٍ تنزيل التحديث…")
                      .setCancelable(false)
                      .show()
                  Thread {
                      try {
                          val conn = URL(url).openConnection() as HttpURLConnection
                          conn.instanceFollowRedirects = true
                          conn.connectTimeout = 15000
                          conn.readTimeout = 30000
                          val dir = File(cacheDir, "update")
                          dir.mkdirs()
                          val file = File(dir, "abufatima-update.apk")
                          conn.inputStream.use { input -> file.outputStream().use { output -> input.copyTo(output) } }
                          runOnUiThread {
                              dlg.dismiss()
                              val uri = FileProvider.getUriForFile(this, "$packageName.files", file)
                              val i = Intent(Intent.ACTION_VIEW)
                              i.setDataAndType(uri, "application/vnd.android.package-archive")
                              i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                              startActivity(i)
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              dlg.dismiss()
                              toast("فشل تنزيل التحديث. حاول لاحقاً.")
                          }
                      }
                  }.start()
              }
          }
          EOF

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Decode signing key
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/abufatima.jks"

      - name: Build APK
        env:
          KS_PATH: ${{ runner.temp }}/abufatima.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk abufatima.apk

      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ابو فاطمة ${{ github.run_number }}
          files: abufatima.apk
