<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أستاذ حيدر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --head:#517da2; --head2:#4a7396; --accent:#3a8ad0; --badge:#4ca3e0; --muted-badge:#b8c1ca;
  --txt:#222; --sub:#8a96a3; --line:#ececec; --bg:#fff; --soft:#f1f3f5;
  --chatbg:#d9e4d0; --bubble:#fff; --time:#9aa6b2; --green:#4fae4e; --red:#e05050;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#cfd8df;font-family:"Noto Sans Arabic","DejaVu Sans",sans-serif;color:var(--txt);
  -webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.app{position:relative;width:100%;max-width:420px;height:100vh;height:100dvh;background:var(--bg);overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto}

/* ===== top bar ===== */
.bar{height:56px;flex:none;background:var(--head);color:#fff;display:flex;align-items:center;gap:6px;padding:0 6px;
  box-shadow:0 1px 3px rgba(0,0,0,.18);position:relative;z-index:2}
.bar .title{flex:1;font-size:19px;font-weight:600;padding:0 10px}
.ib{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ib:active{background:rgba(255,255,255,.15)}
.ib svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== avatars ===== */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none;
  background-size:cover;background-position:center}
.av54{width:54px;height:54px;font-size:19px}
.av42{width:42px;height:42px;font-size:15px}
.av38{width:38px;height:38px;font-size:14px}
.av64{width:64px;height:64px;font-size:22px}
.av96{width:96px;height:96px;font-size:34px}
.c4{background:#e17076}.c5a{background:#7bc862}.c5b{background:#6ec9cb}.c6a{background:#65aadd}.c6b{background:#a695e7}
.cT{background:linear-gradient(160deg,#f0b75a,#d9893a)}

.vbadge{width:17px;height:17px;flex:none;display:inline-block;vertical-align:-3px}

/* ===== chat list ===== */
.row{display:flex;align-items:center;gap:12px;padding:9px 14px;position:relative}
.row:active{background:#f2f2f2}
.row .mid{flex:1;min-width:0;border-bottom:1px solid var(--line);padding:6px 0 12px;align-self:stretch;
  display:flex;flex-direction:column;justify-content:center}
.row:last-child .mid{border-bottom:0}
.row .l1{display:flex;align-items:center;gap:6px}
.row .name{font-weight:600;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:5px}
.row .time{font-size:12.5px;color:var(--sub);flex:none}
.row .l2{display:flex;align-items:center;gap:6px;margin-top:3px}
.row .prev{flex:1;min-width:0;font-size:14.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .prev b{color:var(--accent);font-weight:500}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--badge);color:#fff;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;padding:0 6px;flex:none}
.badge.muted{background:var(--muted-badge)}
.chanico{width:15px;height:15px;flex:none}
.fab{position:absolute;bottom:20px;left:18px;width:56px;height:56px;border-radius:50%;background:#5aa0d8;
  box-shadow:0 3px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.fab svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== picker ===== */
.hint{padding:16px 18px 8px;font-size:14px;color:var(--accent);font-weight:600}
.hintsub{padding:0 18px 10px;font-size:13px;color:var(--sub);line-height:1.7}

/* ===== chat ===== */
.chathead{height:56px;flex:none;background:var(--head);color:#fff;display:flex;align-items:center;gap:8px;padding:0 4px 0 10px;
  box-shadow:0 1px 3px rgba(0,0,0,.18);z-index:2}
.chathead .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.chathead .t1{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chathead .t2{font-size:13px;color:#d5e3f0;margin-top:-2px}
.pinned{flex:none;background:#fff;display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid #e5e5e5;z-index:1}
.pinned .ln{width:2px;align-self:stretch;background:var(--accent);border-radius:2px}
.pinned .p1{font-size:13.5px;color:var(--accent);font-weight:600}
.pinned .p2{font-size:13.5px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.chatbody{flex:1;overflow-y:auto;padding:10px 10px 14px;
  background-color:var(--chatbg);
  background-image:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.35) 0 2px,transparent 3px),
    radial-gradient(circle at 70% 60%,rgba(120,150,100,.18) 0 2px,transparent 3px),
    linear-gradient(160deg,#cfe0c4,#dbe7cf 50%,#cddfd4);
  background-size:38px 38px,46px 46px,100% 100%}
.datepill{display:table;margin:8px auto;background:rgba(80,100,70,.35);color:#fff;font-size:13px;font-weight:500;
  padding:3px 11px;border-radius:12px}
.msg{direction:ltr;display:flex;margin:4px 0}
.bubble{direction:rtl;background:var(--bubble);border-radius:14px 14px 14px 4px;max-width:88%;min-width:120px;
  box-shadow:0 1px 1px rgba(0,0,0,.12);overflow:hidden;position:relative}
.bubble .who{font-size:13.5px;font-weight:600;color:#d08a2b;padding:7px 10px 0;display:flex;align-items:center;gap:4px}
.bubble .txt{font-size:15.5px;line-height:1.65;padding:4px 10px 2px;white-space:pre-line}
.bubble .meta{display:flex;justify-content:flex-start;gap:8px;align-items:center;font-size:12px;color:var(--time);
  padding:0 10px 6px;direction:ltr}
.bubble .meta .eye{display:flex;align-items:center;gap:3px}
.bubble .meta svg{width:14px;height:14px;fill:none;stroke:var(--time);stroke-width:2}
.bubble .meta .edited{font-style:normal}
.hwimg{height:190px;margin:0;position:relative;overflow:hidden;
  background:repeating-linear-gradient(180deg,#fdfcf7 0 23px,#c9dbe9 23px 24px);
  border-bottom:1px solid #eee}
.hwimg::before{content:"";position:absolute;top:0;bottom:0;right:26px;width:2px;background:#e9a3a3}
.hwimg .hand{position:absolute;right:38px;top:16px;left:14px;font-size:15px;line-height:24px;color:#2c3e8f;
  font-family:"Noto Sans Arabic",cursive}
.reply-bar{display:none}

.bottom{flex:none;background:#fff;border-top:1px solid #e3e3e3}
.mutebar{height:50px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:600;font-size:15px}
.inputbar{display:flex;align-items:flex-end;gap:2px;padding:4px 4px}
.inputbar .field{flex:1;min-height:42px;max-height:120px;border:0;outline:0;resize:none;font-size:16px;padding:10px 6px;line-height:1.4;
  background:transparent}
.inputbar .ib svg{stroke:#8a96a3}
.inputbar .send svg{stroke:var(--accent)}
.gradetag{font-size:12px;color:var(--sub);padding:6px 14px 0}

/* context menu */
.ctx{position:absolute;inset:0;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;z-index:30}
.ctx.on{display:flex}
.ctx .box{background:#fff;border-radius:10px;min-width:220px;padding:6px 0;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.ctx .it{display:flex;align-items:center;gap:16px;padding:12px 18px;font-size:15.5px;width:100%}
.ctx .it:active{background:#f1f1f1}
.ctx .it.red{color:var(--red)}

/* ===== drawer ===== */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);display:none;z-index:20}
.scrim.on{display:block}
.drawer{position:absolute;top:0;bottom:0;right:0;width:82%;max-width:330px;background:#fff;z-index:21;
  transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-2px 0 12px rgba(0,0,0,.25)}
.drawer.on{transform:none}
.dhead{background:var(--head);color:#fff;padding:22px 18px 14px}
.dhead .dn{font-size:16px;font-weight:600;margin-top:14px;display:flex;align-items:center;gap:5px}
.dhead .ds{font-size:13.5px;color:#d5e3f0;margin-top:2px}
.ditem{display:flex;align-items:center;gap:26px;padding:13px 20px;font-size:15.5px;width:100%;text-align:right}
.ditem:active{background:#f2f2f2}
.ditem svg{width:23px;height:23px;fill:none;stroke:#8a96a3;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dsep{height:1px;background:var(--line);margin:6px 0}
.dsec{font-size:13.5px;color:var(--accent);font-weight:600;padding:10px 20px 4px}
.dver{margin-top:auto;padding:14px 20px;font-size:12.5px;color:var(--sub)}

/* ===== profile / info ===== */
.bighead{background:var(--head);color:#fff;padding:6px 6px 22px;flex:none}
.bighead .hrow{display:flex;align-items:center;gap:16px;padding:10px 14px 0}
.bighead .hn{font-size:20px;font-weight:600;display:flex;align-items:center;gap:6px}
.bighead .hs{font-size:14px;color:#d5e3f0;margin-top:2px}
.sect{background:#fff;margin-bottom:10px}
.sect .sh{font-size:14.5px;color:var(--accent);font-weight:600;padding:14px 18px 6px}
.info{padding:10px 18px;border-bottom:1px solid var(--line)}
.info:last-child{border-bottom:0}
.info .v{font-size:15.5px;line-height:1.6}
.info .k{font-size:13px;color:var(--sub);margin-top:2px}
.gray{background:var(--soft)}
.setrow{display:flex;align-items:center;gap:18px;padding:14px 18px;border-bottom:1px solid var(--line);width:100%;text-align:right}
.setrow:last-child{border-bottom:0}
.setrow .sv{flex:1}
.setrow .s1{font-size:15.5px}
.setrow .s2{font-size:13px;color:var(--sub);margin-top:2px}
.setrow svg{width:23px;height:23px;fill:none;stroke:#8a96a3;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sw{width:36px;height:20px;border-radius:10px;background:#c4cbd2;position:relative;flex:none;transition:.15s}
.sw i{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:#6aa9de}
.sw.on i{right:18px}
.mediagrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.mediagrid div{aspect-ratio:1;background:repeating-linear-gradient(180deg,#fdfcf7 0 9px,#c9dbe9 9px 10px)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs div{flex:1;text-align:center;padding:12px 0;font-size:14.5px;color:var(--sub);font-weight:600}
.tabs div.on{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}

/* ===== forms ===== */
.form{padding:16px 18px}
.flabel{font-size:13.5px;color:var(--accent);font-weight:600;margin:14px 0 4px}
.finput{width:100%;border:0;border-bottom:2px solid #dfe5ea;outline:0;font-size:16px;padding:8px 0;background:transparent}
.finput:focus{border-color:var(--accent)}
.fnote{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.7}
.camwrap{display:flex;flex-direction:column;align-items:center;padding:18px 0 4px;gap:8px}
.camwrap .av{position:relative}
.camwrap .cam{position:absolute;bottom:0;left:0;width:30px;height:30px;border-radius:50%;background:var(--accent);
  border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.camwrap .cam svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2}
.link{color:var(--accent);font-size:15px;font-weight:500}
.btn{display:block;width:100%;text-align:center;background:#5aa0d8;color:#fff;font-weight:600;font-size:15.5px;
  padding:13px;border-radius:8px;margin-top:18px}
.revoke{color:var(--red);font-size:14px;font-weight:600}

.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(40,40,40,.92);color:#fff;
  padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:40;white-space:nowrap}
.toast.on{display:block}

.dot{width:12px;height:12px;border-radius:50%;background:#4fce5d;border:2px solid #fff;position:absolute;bottom:0;left:0}
.avwrap{position:relative;flex:none}
.online{color:var(--accent)!important}
.namebox{margin:6px 18px 4px;padding:4px 0}
.namebox input{width:100%;border:0;border-bottom:2px solid #dfe5ea;outline:0;font-size:16px;padding:8px 0}
.namebox input:focus{border-color:var(--accent)}
.err{color:var(--red);font-size:13px;padding:2px 18px 0;display:none}
.listsec{font-size:14px;color:var(--accent);font-weight:600;padding:14px 18px 6px;background:var(--soft)}

/* preview-only role switch */
.sim{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:99;background:#fff3cd;border:1px solid #e6c767;
  border-radius:12px;padding:5px;display:flex;gap:4px;align-items:center;font-size:11px;color:#6b5a1c;
  box-shadow:0 2px 10px rgba(0,0,0,.18)}
.sim b{padding:0 4px;font-weight:600}
.sim button{padding:5px 10px;border-radius:8px;background:#fff;font-size:11.5px}
.sim button.on{background:#6b5a1c;color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="app" id="app">

<!-- ===================== 1. FIRST RUN: PICK SECTION ===================== -->
<section class="screen" id="s-pick">
  <div class="bar"><div class="title">أستاذ حيدر</div></div>
  <div class="scroll">
    <div class="hint">اسم الطالب</div>
    <div class="namebox"><input id="studentName" placeholder="مثال: أحمد علي حسين"></div>
    <div class="hintsub">يظهر الاسم لإدارة المجموعة فقط، ولا يراه باقي الأهالي.</div>
    <div class="err" id="nameErr">اكتب اسم الطالب أولاً</div>
    <div class="hint" style="padding-top:10px">اختر الشعبة</div>
    <div class="hintsub">يمكنك تغييرها لاحقاً من الإعدادات.</div>
    <div id="pickList"></div>
  </div>
</section>

<!-- ===================== 2. CHAT LIST ===================== -->
<section class="screen" id="s-list">
  <div class="bar">
    <button class="ib" onclick="openDrawer()" aria-label="القائمة"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="title">أستاذ حيدر</div>
    <button class="ib" onclick="toast('بحث داخل الواجبات')" aria-label="بحث"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
  </div>
  <div class="scroll" id="chatList"></div>
</section>

<!-- ===================== 3. CHAT ===================== -->
<section class="screen" id="s-chat">
  <div class="chathead">
    <button class="ib" onclick="go('s-list')" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="who" onclick="go('s-info')">
      <div class="av av42" id="chatAv"></div>
      <div style="min-width:0;text-align:right">
        <div class="t1" id="chatTitle"></div>
        <div class="t2" id="chatSub"></div>
      </div>
    </button>
    <button class="ib" onclick="go('s-info')" aria-label="المزيد"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg></button>
  </div>
  <div class="pinned" id="pinned">
    <div class="ln"></div>
    <div style="min-width:0">
      <div class="p1">رسالة مثبّتة</div>
      <div class="p2" id="pinnedText"></div>
    </div>
  </div>
  <div class="chatbody" id="chatBody"></div>
  <div class="bottom" id="chatBottom"></div>
</section>

<!-- ===================== 4. GROUP INFO ===================== -->
<section class="screen gray" id="s-info">
  <div class="bighead">
    <button class="ib" onclick="go('s-chat')"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <div class="hrow">
      <div class="av av64" id="infoAv"></div>
      <div><div class="hn" id="infoName"></div><div class="hs" id="infoSub"></div></div>
    </div>
  </div>
  <div class="scroll">
    <div class="sect">
      <div class="sh">معلومات</div>
      <div class="info"><div class="v" id="infoDesc"></div><div class="k">الوصف</div></div>
    </div>
    <div class="sect">
      <button class="setrow" onclick="toggleSw('swInfo')">
        <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
        <div class="sv"><div class="s1">الإشعارات</div><div class="s2">تنبيه عند كل واجب جديد</div></div>
        <div class="sw on" id="swInfo"><i></i></div>
      </button>
    </div>
    <div class="sect">
      <div class="tabs" id="infoTabs"></div>
      <div id="infoTabBody"></div>
    </div>
  </div>
</section>

<!-- ===================== VIEWERS (staff) ===================== -->
<section class="screen gray" id="s-views">
  <div class="bar">
    <button class="ib" onclick="go('s-chat')"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <div class="title" id="viewsTitle">المشاهدات</div>
  </div>
  <div class="scroll" id="viewsBody"></div>
</section>

<!-- ===================== 5. TEACHER PROFILE ===================== -->
<section class="screen gray" id="s-profile">
  <div class="bighead">
    <button class="ib" onclick="go('s-list')"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <div class="hrow">
      <div class="av av64 cT" id="profAv">أح</div>
      <div><div class="hn"><span class="tname">أستاذ حيدر</span><span class="vb"></span></div><div class="hs">الرابع · الخامس · السادس الابتدائي</div></div>
    </div>
  </div>
  <div class="scroll">
    <div class="sect">
      <div class="sh">معلومات</div>
      <div class="info"><div class="v tbio">نرسل واجبات الصفوف الرابع والخامس والسادس أولاً بأول</div><div class="k">النبذة</div></div>
      <div class="info"><div class="v">الرابع · الخامس أ، ب · السادس أ، ب</div><div class="k">الصفوف</div></div>
    </div>
    <div class="sect">
      <button class="setrow" onclick="shareApp()">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg>
        <div class="sv"><div class="s1" style="color:var(--accent)">مشاركة التطبيق</div></div>
      </button>
    </div>
  </div>
</section>

<!-- ===================== 6. EDIT PROFILE (staff) ===================== -->
<section class="screen" id="s-edit">
  <div class="bar">
    <button class="ib" onclick="go('s-list')"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <div class="title">تعديل الملف الشخصي</div>
    <button class="ib" onclick="saveProfile()" aria-label="حفظ"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>
  </div>
  <div class="scroll">
    <div class="camwrap">
      <div class="av av96 cT" id="editAv" onclick="toast('يفتح معرض الصور لاختيار صورة')">أح
        <span class="cam"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
      </div>
      <button class="link" onclick="toast('يفتح معرض الصور لاختيار صورة')">تغيير الصورة</button>
    </div>
    <div class="form">
      <div class="flabel">الاسم</div>
      <input class="finput" id="editName" value="أستاذ حيدر">
      <div class="flabel">النبذة</div>
      <input class="finput" id="editBio" value="نرسل واجبات الصفوف الرابع والخامس والسادس أولاً بأول">
      <div class="fnote">تظهر النبذة للأهالي في صفحة الأستاذ.</div>
    </div>
