name: Build Abu Fatima

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/abufatima/app app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          def runNumber = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")

          android {
              namespace 'com.abufatima.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.abufatima.app"
                  minSdk 21
                  targetSdk 34
                  versionCode runNumber
                  versionName "1." + runNumber
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_PATH"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias "abufatima"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
              implementation platform('com.google.firebase:firebase-bom:32.7.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <application
                  android:label="ابو فاطمة"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
          </paths>
          EOF

          cat > app/src/main/java/com/abufatima/app/MainActivity.kt <<'EOF'
          package com.abufatima.app

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.util.Base64
          import android.view.Gravity
          import android.view.View
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.widget.SwitchCompat
          import androidx.core.content.FileProvider
          import androidx.core.content.pm.PackageInfoCompat
          import androidx.core.graphics.drawable.RoundedBitmapDrawableFactory
          import com.google.firebase.FirebaseApp
          import com.google.firebase.FirebaseOptions
          import com.google.firebase.auth.FirebaseAuth
          import com.google.firebase.firestore.DocumentSnapshot
          import com.google.firebase.firestore.FieldValue
          import com.google.firebase.firestore.FirebaseFirestore
          import com.google.firebase.firestore.ListenerRegistration
          import com.google.firebase.firestore.SetOptions
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Locale

          private val INK = Color.parseColor("#1B2A4A")
          private val INK2 = Color.parseColor("#0E1830")
          private val GOLD = Color.parseColor("#C99A3E")
          private val BG = Color.parseColor("#F6F3EC")
          private val CARD = Color.WHITE
          private val LINE = Color.parseColor("#E4DDCD")
          private val MUT = Color.parseColor("#6B7280")
          private val BLUE = Color.parseColor("#2F6FB0")
          private val RED = Color.parseColor("#B0413F")
          private val SOFT = Color.parseColor("#C7CFE0")

          class MainActivity : AppCompatActivity() {

              companion object {
                  const val DEV_CODE = "1B9EF0F9"
                  const val REPO = "maxhssss7-png/abo"
                  val GRADES = listOf("g4", "g5", "g6")
                  val GRADE_NAME = mapOf(
                      "g4" to "الصف الرابع الابتدائي",
                      "g5" to "الصف الخامس الابتدائي",
                      "g6" to "الصف السادس الابتدائي"
                  )
                  val GRADE_SHORT = mapOf("g4" to "الصف الرابع", "g5" to "الصف الخامس", "g6" to "الصف السادس")
                  val GRADE_WORD = mapOf("g4" to "الرابع", "g5" to "الخامس", "g6" to "السادس")
                  val GRADE_DIGIT = mapOf("g4" to "٤", "g5" to "٥", "g6" to "٦")
                  val GRADE_COLOR = mapOf(
                      "g4" to Color.parseColor("#2F8F6E"),
                      "g5" to Color.parseColor("#2F6FB0"),
                      "g6" to Color.parseColor("#8A4FB0")
                  )
                  val GRADE_LIGHT = mapOf(
                      "g4" to Color.parseColor("#E4F3EC"),
                      "g5" to Color.parseColor("#E4EEF8"),
                      "g6" to Color.parseColor("#F1E6F8")
                  )
              }

              private lateinit var db: FirebaseFirestore
              private lateinit var auth: FirebaseAuth

              private var uid = ""
              private var deviceCode = ""
              private var role = "parent"
              private var linkProblem = false
              private var started = false

              private var profName = "ابو فاطمة"
              private var profBio = "واجبات الصفوف الرابع والخامس والسادس الابتدائي"
              private var profPhoto: String? = null
              private var profVerified = false

              private var render: (() -> Unit)? = null
              private var backAction: (() -> Unit)? = null
              private var postsReg: ListenerRegistration? = null
              private var rolesReg: ListenerRegistration? = null

              private var pickedPhoto: String? = null
              private var editAvatarHolder: FrameLayout? = null
              private var pendingUpdateUrl: String? = null

              private val prefs by lazy { getSharedPreferences("abufatima", Context.MODE_PRIVATE) }

              private val pickImage = registerForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  if (uri != null) onImagePicked(uri)
              }

              private val isStaff get() = role == "teacher" || role == "developer"
              private val isDev get() = role == "developer"

              // ===================== startup =====================

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.decorView.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  window.statusBarColor = INK

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          val b = backAction
                          if (b != null) b() else finish()
                      }
                  })

                  val app = if (FirebaseApp.getApps(this).isEmpty()) {
                      FirebaseApp.initializeApp(
                          this,
                          FirebaseOptions.Builder()
                              .setApiKey("AIzaSyCcHSKty9M2yXqcbnWSA9s0CG_dOWmXnB4")
                              .setApplicationId("1:917500086406:android:68a165c0fd305ad74e6907")
                              .setProjectId("abof-6ea3c")
                              .setStorageBucket("abof-6ea3c.firebasestorage.app")
                              .setGcmSenderId("917500086406")
                              .build()
                      )
                  } else {
                      FirebaseApp.getInstance()
                  }
                  auth = FirebaseAuth.getInstance(app)
                  db = FirebaseFirestore.getInstance(app)

                  val androidId = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "00000000"
                  deviceCode = androidId.padEnd(8, '0').take(8).uppercase()

                  showMessage("جارٍ التحميل…")

                  val current = auth.currentUser
                  if (current != null) {
                      onSignedIn(current.uid)
                  } else {
                      auth.signInAnonymously()
                          .addOnSuccessListener { res -> onSignedIn(res.user?.uid ?: "") }
                          .addOnFailureListener { e ->
                              showMessage("تعذّر الاتصال. تأكد من الإنترنت ثم أعد فتح التطبيق.\n\n" + (e.message ?: ""))
                          }
                  }

                  checkForUpdate()
              }

              override fun onResume() {
                  super.onResume()
                  val u = pendingUpdateUrl
                  if (u != null && canInstall()) {
                      pendingUpdateUrl = null
                      downloadUpdate(u)
                  }
              }

              private fun onSignedIn(id: String) {
                  uid = id
                  val ref = db.collection("codes").document(deviceCode)
                  ref.get()
                      .addOnSuccessListener { snap ->
                          if (!snap.exists()) {
                              ref.set(mapOf("uid" to uid, "at" to FieldValue.serverTimestamp()))
                                  .addOnCompleteListener { watchRole() }
                          } else {
                              linkProblem = snap.getString("uid") != uid
                              watchRole()
                          }
                      }
                      .addOnFailureListener { watchRole() }
              }

              private fun watchRole() {
                  if (deviceCode == DEV_CODE && !linkProblem) {
                      role = "developer"
                      start()
                      return
                  }
                  db.collection("roles").document(uid).addSnapshotListener { snap, _ ->
                      role = if (snap != null && snap.getString("role") == "teacher") "teacher" else "parent"
                      if (!started) start() else render?.invoke()
                  }
              }

              private fun start() {
                  if (started) return
                  started = true
                  db.collection("profile").document("main").addSnapshotListener { snap, _ ->
                      if (snap != null && snap.exists()) {
                          profName = snap.getString("name")?.takeIf { it.isNotBlank() } ?: "ابو فاطمة"
                          profBio = snap.getString("bio") ?: ""
                          profPhoto = snap.getString("photo")
                          profVerified = snap.getBoolean("verified") ?: false
                      }
                      render?.invoke()
                  }
                  goHome()
              }

              private fun goHome() {
                  val g = prefs.getString("grade", null)
                  if (g != null && g in GRADES) showFeed(g) else showPicker()
              }

              // ===================== helpers =====================

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun shape(color: Int, radius: Int, strokeColor: Int = 0, strokeWidth: Int = 0): GradientDrawable {
                  val d = GradientDrawable()
                  d.setColor(color)
                  d.cornerRadius = dp(radius).toFloat()
                  if (strokeWidth > 0) d.setStroke(dp(strokeWidth), strokeColor)
                  return d
              }

              private fun oval(color: Int): GradientDrawable {
                  val d = GradientDrawable()
                  d.shape = GradientDrawable.OVAL
                  d.setColor(color)
                  return d
              }

              private fun tv(text: String, size: Float, color: Int, bold: Boolean = false): TextView {
                  val t = TextView(this)
                  t.text = text
                  t.textSize = size
                  t.setTextColor(color)
                  if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
                  t.setLineSpacing(0f, 1.25f)
                  return t
              }

              private fun vbox(): LinearLayout {
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.VERTICAL
                  return l
              }

              private fun hbox(): LinearLayout {
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.HORIZONTAL
                  l.gravity = Gravity.CENTER_VERTICAL
                  return l
              }

              private fun matchWrap(top: Int = 0, bottom: Int = 0, side: Int = 0): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  p.topMargin = dp(top)
                  p.bottomMargin = dp(bottom)
                  p.leftMargin = dp(side)
                  p.rightMargin = dp(side)
                  return p
              }

              private fun weighted(): LinearLayout.LayoutParams =
                  LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)

              private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_LONG).show()

              private fun button(text: String, bg: Int, fg: Int, onClick: () -> Unit): TextView {
                  val b = tv(text, 15f, fg, true)
                  b.gravity = Gravity.CENTER
                  b.background = shape(bg, 14)
                  b.setPadding(dp(12), dp(14), dp(12), dp(14))
                  b.setOnClickListener { onClick() }
                  return b
              }

              private fun input(hint: String, multiline: Boolean): EditText {
                  val e = EditText(this)
                  e.hint = hint
                  e.textSize = 15f
                  e.setTextColor(INK)
                  e.background = shape(CARD, 14, LINE, 1)
                  e.setPadding(dp(14), dp(12), dp(14), dp(12))
                  if (multiline) {
                      e.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE or InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                      e.minLines = 4
                      e.gravity = Gravity.TOP or Gravity.START
                  } else {
                      e.inputType = InputType.TYPE_CLASS_TEXT
                      e.setSingleLine(true)
                  }
                  return e
              }

              private fun setScreen(content: View, back: (() -> Unit)?, rerender: (() -> Unit)?) {
                  postsReg?.remove()
                  postsReg = null
                  rolesReg?.remove()
                  rolesReg = null
                  backAction = back
                  render = rerender
                  val sv = ScrollView(this)
                  sv.setBackgroundColor(BG)
                  sv.isFillViewport = true
                  sv.addView(content)
                  setContentView(sv)
              }

              private fun showMessage(msg: String) {
                  val box = vbox()
                  box.gravity = Gravity.CENTER
                  box.setPadding(dp(30), dp(30), dp(30), dp(30))
                  val t = tv(msg, 15f, INK)
                  t.gravity = Gravity.CENTER
                  box.addView(t)
                  setScreen(box, null, null)
              }

              private fun decodePhoto(b64: String?): Bitmap? {
                  if (b64.isNullOrBlank()) return null
                  return try {
                      val bytes = Base64.decode(b64, Base64.DEFAULT)
                      BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun avatar(sizeDp: Int, photo: String?, name: String): View {
                  val bmp = decodePhoto(photo)
                  val lp = LinearLayout.LayoutParams(dp(sizeDp), dp(sizeDp))
                  if (bmp != null) {
                      val iv = ImageView(this)
                      val rd = RoundedBitmapDrawableFactory.create(resources, bmp)
                      rd.isCircular = true
                      iv.setImageDrawable(rd)
                      iv.scaleType = ImageView.ScaleType.CENTER_CROP
                      iv.layoutParams = lp
                      return iv
                  }
                  val t = tv(name.trim().take(2), (sizeDp / 2.8f), INK, true)
                  t.gravity = Gravity.CENTER
                  t.background = oval(GOLD)
                  t.layoutParams = lp
                  return t
              }

              private fun verifiedBadge(): TextView {
                  val b = tv("✓", 11f, Color.WHITE, true)
                  b.gravity = Gravity.CENTER
                  b.background = oval(BLUE)
                  val p = LinearLayout.LayoutParams(dp(18), dp(18))
                  p.marginStart = dp(6)
                  b.layoutParams = p
                  return b
              }

              private fun copyText(label: String, text: String) {
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText(label, text))
                  toast("تم النسخ")
              }

              private fun backRow(title: String, onBack: () -> Unit): View {
                  val row = hbox()
                  row.setPadding(dp(16), dp(16), dp(16), dp(8))
                  val back = tv("→", 18f, INK, true)
                  back.gravity = Gravity.CENTER
                  back.background = shape(CARD, 11, LINE, 1)
                  back.layoutParams = LinearLayout.LayoutParams(dp(38), dp(38))
                  back.setOnClickListener { onBack() }
                  row.addView(back)
                  val t = tv(title, 16f, INK, true)
                  val tp = weighted()
                  tp.marginStart = dp(12)
                  t.layoutParams = tp
                  row.addView(t)
                  return row
              }

              // ===================== header =====================

              private fun header(capsule: String): View {
                  val box = vbox()
                  val bg = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(INK, INK2))
                  val r = dp(26).toFloat()
                  bg.cornerRadii = floatArrayOf(0f, 0f, 0f, 0f, r, r, r, r)
                  box.background = bg
                  box.setPadding(dp(20), dp(18), dp(20), dp(22))

                  val cap = tv(capsule, 11f, Color.parseColor("#DFE4EF"))
                  cap.background = shape(Color.parseColor("#22FFFFFF"), 99)
                  cap.setPadding(dp(10), dp(4), dp(10), dp(4))
                  val capRow = LinearLayout(this)
                  capRow.gravity = Gravity.END
                  capRow.addView(cap)
                  box.addView(capRow, matchWrap(bottom = 8))

                  val row = hbox()
                  row.addView(avatar(62, profPhoto, profName))
                  val col = vbox()
                  val cp = weighted()
                  cp.marginStart = dp(14)
                  col.layoutParams = cp
                  val nameRow = hbox()
                  nameRow.addView(tv(profName, 18f, Color.WHITE, true))
                  if (profVerified) nameRow.addView(verifiedBadge())
                  col.addView(nameRow)
                  if (profBio.isNotBlank()) col.addView(tv(profBio, 13f, SOFT), matchWrap(top = 4))
                  row.addView(col)
                  box.addView(row)

                  val actions = hbox()
                  val share = button("📤 مشاركة التطبيق", GOLD, INK) { shareApp() }
                  share.textSize = 13f
                  share.setPadding(dp(8), dp(11), dp(8), dp(11))
                  actions.addView(share, weighted())
                  if (isStaff) {
                      val hub = button("🎓 لوحة المعلم", Color.parseColor("#22FFFFFF"), Color.WHITE) { showHub() }
                      hub.textSize = 13f
                      hub.setPadding(dp(8), dp(11), dp(8), dp(11))
                      val hp = weighted()
                      hp.marginStart = dp(8)
                      actions.addView(hub, hp)
                  }
                  box.addView(actions, matchWrap(top = 16))
                  return box
              }

              private fun deviceFooter(): View {
                  val box = vbox()
                  box.gravity = Gravity.CENTER_HORIZONTAL
                  box.setPadding(dp(20), dp(20), dp(20), dp(30))
                  val t = tv("معرّف جهازك: $deviceCode  (اضغط للنسخ)", 12f, MUT)
                  t.gravity = Gravity.CENTER
                  t.setOnClickListener { copyText("device_id", deviceCode) }
                  box.addView(t)
                  if (linkProblem) {
                      val w = tv("هذا الجهاز مسجّل سابقاً بتثبيت قديم. أرسل المعرّف للمطوّر ليعيد ربطه.", 12f, RED)
                      w.gravity = Gravity.CENTER
                      box.addView(w, matchWrap(top = 6))
                  }
                  return box
              }

              // ===================== picker =====================

              private fun showPicker() {
                  val root = vbox()
                  root.addView(header("تطبيق الواجبات"))
                  root.addView(tv("اختر صف ابنك أو ابنتك", 14f, MUT), matchWrap(top = 22, bottom = 10, side = 20))
                  for (g in GRADES) {
                      val card = hbox()
                      card.background = shape(CARD, 18, LINE, 1)
                      card.setPadding(dp(16), dp(16), dp(16), dp(16))
                      val icon = tv(GRADE_DIGIT[g] ?: "", 20f, GRADE_COLOR[g] ?: INK, true)
                      icon.gravity = Gravity.CENTER
                      icon.background = shape(GRADE_LIGHT[g] ?: LINE, 14)
                      icon.layoutParams = LinearLayout.LayoutParams(dp(48), dp(48))
                      card.addView(icon)
                      val name = tv(GRADE_NAME[g] ?: g, 16f, INK, true)
                      val np = weighted()
                      np.marginStart = dp(14)
                      name.layoutParams = np
                      card.addView(name)
                      card.addView(tv("‹", 20f, MUT))
                      card.setOnClickListener {
                          prefs.edit().putString("grade", g).apply()
                          showFeed(g)
                      }
                      root.addView(card, matchWrap(bottom = 12, side = 20))
                  }
                  root.addView(deviceFooter())
                  setScreen(root, null) { showPicker() }
              }

              // ===================== feed =====================

              private fun showFeed(g: String) {
                  val root = vbox()
                  root.addView(header(GRADE_SHORT[g] ?: ""))

                  val row = hbox()
                  row.setPadding(dp(20), dp(18), dp(20), dp(10))
                  val title = tv("واجبات " + (GRADE_SHORT[g] ?: ""), 16f, INK, true)
                  title.layoutParams = weighted()
                  row.addView(title)
                  val change = tv("تغيير الصف", 13f, BLUE)
                  change.setOnClickListener {
                      prefs.edit().remove("grade").apply()
                      showPicker()
                  }
                  row.addView(change)
                  root.addView(row)

                  val list = vbox()
                  list.setPadding(dp(20), 0, dp(20), 0)
                  list.addView(tv("جارٍ تحميل الواجبات…", 13f, MUT))
                  root.addView(list)
                  root.addView(deviceFooter())

                  setScreen(root, null) { showFeed(g) }

                  postsReg = db.collection("posts").whereEqualTo("grade", g).addSnapshotListener { snap, err ->
                      list.removeAllViews()
                      if (err != null || snap == null) {
                          list.addView(tv("تعذّر تحميل الواجبات. تأكد من الإنترنت.", 14f, RED))
                          return@addSnapshotListener
                      }
                      val docs = snap.documents.sortedByDescending { it.getTimestamp("createdAt")?.seconds ?: Long.MAX_VALUE }
                      if (docs.isEmpty()) {
                          val e = tv("لا توجد واجبات بعد", 14f, MUT)
                          e.gravity = Gravity.CENTER
                          e.setPadding(0, dp(30), 0, dp(30))
                          list.addView(e, matchWrap())
                      }
                      for (d in docs.take(60)) list.addView(postCard(d, g), matchWrap(bottom = 12))
                  }
              }

              private fun postCard(d: DocumentSnapshot, g: String): View {
                  val card = vbox()
                  card.background = shape(CARD, 18, LINE, 1)
                  card.setPadding(dp(14), dp(14), dp(14), dp(14))

                  val top = hbox()
                  val tag = tv(profName, 11f, GRADE_COLOR[g] ?: INK, true)
                  tag.background = shape(GRADE_LIGHT[g] ?: LINE, 99)
                  tag.setPadding(dp(10), dp(4), dp(10), dp(4))
                  top.addView(tag)
                  val spacer = View(this)
                  top.addView(spacer, weighted())
                  val ts = d.getTimestamp("createdAt")
