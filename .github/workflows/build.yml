              private fun buildComposer(bottom: LinearLayout, sid: String) {
                  pendingImage = null
                  val preview = hbox()
                  preview.setPadding(dp(14), dp(8), dp(14), 0)
                  preview.visibility = View.GONE
                  pendingPreview = preview
                  bottom.addView(preview, mw())

                  val target = tv("تنشر إلى: " + (Fb.section(sid)?.name ?: ""), 12f, SUB)
                  target.setPadding(dp(14), dp(6), dp(14), 0)
                  bottom.addView(target)

                  val row = hbox()
                  row.gravity = Gravity.BOTTOM
                  row.setPadding(dp(2), dp(2), dp(2), dp(2))
                  row.addView(iconBtn("📎", 20f, SUB) { pickPostImage.launch("image/*") })
                  val field = EditText(this)
                  field.hint = "اكتب الواجب…"
                  field.background = null
                  field.textSize = 16f
                  field.maxLines = 6
                  field.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE or InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                  field.setPadding(dp(6), dp(10), dp(6), dp(10))
                  row.addView(field, weighted())
                  var busy = false
                  val send = iconBtn("➤", 22f, ACCENT) {}
                  send.rotation = 180f
                  send.setOnClickListener {
                      val text = field.text.toString().trim()
                      val img = pendingImage
                      if (text.isEmpty() && img == null) {
                          toast("اكتب الواجب أو أرفق صورة")
                          return@setOnClickListener
                      }
                      if (busy) return@setOnClickListener
                      busy = true
                      send.alpha = 0.4f
                      val sec = db.collection("sections").document(sid)
                      val ref = sec.collection("posts").document()
                      val batch = db.batch()
                      if (img != null) batch.set(sec.collection("images").document(ref.id), mapOf("data" to Blob.fromBytes(img)))
                      batch.set(
                          ref, mapOf(
                              "text" to text,
                              "createdAt" to FieldValue.serverTimestamp(),
                              "by" to uid,
                              "hasImage" to (img != null),
                              "views" to 0
                          )
                      )
                      batch.commit()
                          .addOnSuccessListener {
                              busy = false
                              send.alpha = 1f
                              field.setText("")
                              clearPendingImage()
                          }
                          .addOnFailureListener { e ->
                              busy = false
                              send.alpha = 1f
                              toast("فشل الإرسال: " + (e.message ?: ""))
                          }
                  }
                  row.addView(send)
                  bottom.addView(row, mw())
              }

              private fun clearPendingImage() {
                  pendingImage = null
                  pendingPreview?.removeAllViews()
                  pendingPreview?.visibility = View.GONE
              }

              private fun compress(uri: Uri, maxSide: Int, quality: Int): ByteArray? {
                  val bounds = BitmapFactory.Options()
                  bounds.inJustDecodeBounds = true
                  contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                  var sample = 1
                  while (bounds.outWidth / (sample * 2) >= maxSide || bounds.outHeight / (sample * 2) >= maxSide) sample *= 2
                  val opts = BitmapFactory.Options()
                  opts.inSampleSize = sample
                  val src = contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) } ?: return null
                  val scale = minOf(1f, maxSide.toFloat() / maxOf(src.width, src.height))
                  val bmp = if (scale < 1f) Bitmap.createScaledBitmap(src, (src.width * scale).toInt(), (src.height * scale).toInt(), true) else src
                  val out = ByteArrayOutputStream()
                  bmp.compress(Bitmap.CompressFormat.JPEG, quality, out)
                  return out.toByteArray()
              }

              private fun onPostImagePicked(uri: Uri) {
                  try {
                      var bytes = compress(uri, 1280, 72) ?: return
                      if (bytes.size > 900_000) bytes = compress(uri, 1024, 55) ?: return
                      pendingImage = bytes
                      val preview = pendingPreview ?: return
                      preview.removeAllViews()
                      val iv = ImageView(this)
                      iv.setImageBitmap(BitmapFactory.decodeByteArray(bytes, 0, bytes.size))
                      iv.scaleType = ImageView.ScaleType.CENTER_CROP
                      preview.addView(iv, LinearLayout.LayoutParams(dp(56), dp(56)))
                      val t = tv("صورة مرفقة", 14f, TXT)
                      val tp = weighted()
                      tp.marginStart = dp(12)
                      t.layoutParams = tp
                      preview.addView(t)
                      val x = tv("إزالة", 14f, RED, true)
                      x.setOnClickListener { clearPendingImage() }
                      preview.addView(x)
                      preview.visibility = View.VISIBLE
                  } catch (e: Exception) {
                      toast("تعذّرت قراءة الصورة")
                  }
              }

