              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
              private fun dpf(v: Int): Float = v * resources.displayMetrics.density
              private val screenW get() = resources.displayMetrics.widthPixels

              private fun shape(color: Int, radius: Int, strokeColor: Int = 0, strokeWidth: Int = 0): GradientDrawable {
                  val d = GradientDrawable()
                  d.setColor(color)
                  d.cornerRadius = dpf(radius)
                  if (strokeWidth > 0) d.setStroke(dp(strokeWidth), strokeColor)
                  return d
              }

              private fun oval(color: Int): GradientDrawable {
                  val d = GradientDrawable()
                  d.shape = GradientDrawable.OVAL
                  d.setColor(color)
                  return d
              }

              private fun tv(text: String, size: Float, color: Int, bold: Boolean = false): TextView {
                  val t = TextView(this)
                  t.text = text
                  t.textSize = size
                  t.setTextColor(color)
                  if (bold) t.setTypeface(Typeface.DEFAULT, Typeface.BOLD)
                  return t
              }

              private fun vbox(): LinearLayout {
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.VERTICAL
                  return l
              }

              private fun hbox(): LinearLayout {
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.HORIZONTAL
                  l.gravity = Gravity.CENTER_VERTICAL
                  return l
              }

              private fun mw(top: Int = 0, bottom: Int = 0, side: Int = 0): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(-1, -2)
                  p.topMargin = dp(top)
                  p.bottomMargin = dp(bottom)
                  p.leftMargin = dp(side)
                  p.rightMargin = dp(side)
                  return p
              }

              private fun weighted(): LinearLayout.LayoutParams = LinearLayout.LayoutParams(0, -2, 1f)

              private fun fill(): LinearLayout.LayoutParams = LinearLayout.LayoutParams(-1, 0, 1f)

              private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_LONG).show()

              private fun copyText(text: String) {
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("text", text))
                  toast("تم النسخ")
              }

              private fun iconBtn(symbol: String, size: Float, color: Int, onClick: () -> Unit): TextView {
                  val b = tv(symbol, size, color, true)
                  b.gravity = Gravity.CENTER
                  b.layoutParams = LinearLayout.LayoutParams(dp(48), dp(48))
                  b.setOnClickListener { onClick() }
                  return b
              }

              private fun topBar(title: String, onBack: (() -> Unit)?, extra: View? = null): LinearLayout {
                  val bar = hbox()
