              private fun openChat(sid: String) {
                  val s = Fb.section(sid) ?: return
                  val pg = page()

                  // header
                  val head = hbox()
                  head.setBackgroundColor(HEAD)
                  head.elevation = dpf(3)
                  head.setPadding(dp(4), 0, dp(10), 0)
                  head.addView(iconBtn("→", 22f, Color.WHITE) { showList() })
                  val who = hbox()
                  who.addView(sectionAvatar(s, 42))
                  val wcol = vbox()
                  val wp = weighted()
                  wp.marginStart = dp(10)
                  wcol.layoutParams = wp
                  val t1 = tv(s.name, 17f, Color.WHITE, true)
                  t1.setSingleLine(true)
                  wcol.addView(t1)
                  val t2 = tv("…", 13f, HEADSUB)
                  wcol.addView(t2)
                  who.addView(wcol)
                  who.setOnClickListener { showInfo(sid) }
                  head.addView(who, weighted())
                  pg.addView(head, LinearLayout.LayoutParams(-1, dp(56)))

                  // pinned
                  val pinBar = hbox()
                  pinBar.setBackgroundColor(Color.WHITE)
                  pinBar.setPadding(dp(14), dp(7), dp(14), dp(7))
                  val pinLine = View(this)
                  pinLine.setBackgroundColor(ACCENT)
                  pinBar.addView(pinLine, LinearLayout.LayoutParams(dp(2), dp(34)))
                  val pinCol = vbox()
                  val pcp = weighted()
                  pcp.marginStart = dp(10)
                  pinCol.layoutParams = pcp
                  pinCol.addView(tv("رسالة مثبّتة", 13.5f, ACCENT, true))
                  val pinText = tv("", 13.5f, Color.parseColor("#555555"))
                  pinText.setSingleLine(true)
                  pinText.ellipsize = TextUtils.TruncateAt.END
                  pinCol.addView(pinText)
                  pinBar.addView(pinCol)
                  if (isStaff) {
                      pinBar.setOnLongClickListener {
                          AlertDialog.Builder(this).setItems(arrayOf("إلغاء التثبيت")) { _, _ ->
                              db.collection("sections").document(sid)
                                  .set(mapOf("pinText" to FieldValue.delete(), "pinId" to FieldValue.delete()), SetOptions.merge())
                          }.show()
                          true
                      }
                  }
                  pg.addView(pinBar, mw())
                  val pinDiv = divider()
                  pg.addView(pinDiv)

                  // messages
                  val msgs = vbox()
                  msgs.setPadding(dp(10), dp(8), dp(10), dp(14))
                  val sv = ScrollView(this)
                  sv.isFillViewport = true
                  sv.background = GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(Color.parseColor("#CFE0C4"), Color.parseColor("#DBE7CF"), Color.parseColor("#CDDFD4"))
                  )
                  sv.addView(msgs)
                  pg.addView(sv, fill())

                  // bottom
                  val bottom = vbox()
                  bottom.setBackgroundColor(Color.WHITE)
                  pg.addView(divider())
                  pg.addView(bottom, mw())

                  if (isStaff) buildComposer(bottom, sid) else buildMuteBar(bottom, sid)

                  fun render() {
                      val pin = pins[sid]
                      pinBar.visibility = if (pin != null) View.VISIBLE else View.GONE
                      pinDiv.visibility = pinBar.visibility
                      pinText.text = pin?.first?.replace('\n', ' ') ?: ""

                      val items = posts[sid] ?: emptyList()
                      msgs.removeAllViews()
                      var lastDay = ""
                      if (items.isEmpty()) {
                          val e = tv("لا توجد رسائل بعد", 14f, Color.WHITE)
                          e.background = shape(Color.parseColor("#59506446"), 14)
                          e.setPadding(dp(14), dp(6), dp(14), dp(6))
                          val ep = LinearLayout.LayoutParams(-2, -2)
                          ep.gravity = Gravity.CENTER_HORIZONTAL
                          ep.topMargin = dp(30)
                          msgs.addView(e, ep)
                      }
                      for (d in items) {
                          val ms = timeOf(d)
                          val day = dayLabel(ms)
                          if (day != lastDay) {
                              lastDay = day
                              val pill = tv(day, 13f, Color.WHITE, true)
                              pill.background = shape(Color.parseColor("#59506446"), 12)
                              pill.setPadding(dp(11), dp(3), dp(11), dp(3))
                              val pp = LinearLayout.LayoutParams(-2, -2)
                              pp.gravity = Gravity.CENTER_HORIZONTAL
                              pp.topMargin = dp(8)
                              pp.bottomMargin = dp(4)
                              msgs.addView(pill, pp)
                          }
                          msgs.addView(bubble(sid, d))
                      }
                      prefs.edit().putLong("read_$sid", System.currentTimeMillis()).apply()
                      if (!isStaff) markViewed(items)
                      sv.post { sv.fullScroll(View.FOCUS_DOWN) }
                  }

                  prefs.edit().putLong("read_$sid", System.currentTimeMillis()).apply()
                  render()
                  setScreen(pg, { showList() }, { render() }, { render() })

                  val task = object : Runnable {
                      override fun run() {
                          refreshCounts(sid, t2)
                          handler.postDelayed(this, 60_000)
                      }
                  }
                  countsTask = task
                  handler.post(task)
              }

              private fun refreshCounts(sid: String, target: TextView) {
                  db.collection("members").whereEqualTo("section", sid).count().get(AggregateSource.SERVER)
                      .addOnSuccessListener { all ->
                          val since = Timestamp(Date(System.currentTimeMillis() - 3 * 60_000L))
                          db.collection("members").whereGreaterThan("seen_$sid", since).count().get(AggregateSource.SERVER)
                              .addOnSuccessListener { on ->
                                  target.text = "${all.count} عضو، ${on.count} متصل"
                              }
                              .addOnFailureListener { target.text = "${all.count} عضو" }
                      }
              }

              private fun markViewed(items: List<DocumentSnapshot>) {
                  val seen = prefs.getStringSet("seen_posts", emptySet())?.toMutableSet() ?: mutableSetOf()
                  var changed = false
                  for (d in items) {
                      if (d.metadata.hasPendingWrites()) continue
                      if (seen.contains(d.id)) continue
                      seen.add(d.id)
                      changed = true
                      d.reference.update("views", FieldValue.increment(1))
                  }
                  if (changed) {
                      val trimmed = if (seen.size > 400) seen.toList().takeLast(300).toSet() else seen
                      prefs.edit().putStringSet("seen_posts", trimmed).apply()
                  }
              }

              private fun bubble(sid: String, d: DocumentSnapshot): View {
                  val wrap = LinearLayout(this)
                  wrap.layoutDirection = View.LAYOUT_DIRECTION_LTR
                  wrap.gravity = Gravity.LEFT
                  val maxW = (screenW * 0.80f).toInt()

                  val b = vbox()
                  b.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  val bg = GradientDrawable()
                  bg.setColor(Color.WHITE)
                  val r = dpf(14)
                  val small = dpf(4)
                  bg.cornerRadii = floatArrayOf(r, r, r, r, r, r, small, small)
                  b.background = bg
                  b.elevation = dpf(1)
                  b.clipToOutline = true

                  val nameRow = nameWithBadge(13.5f, NAMECOL, BADGE, Color.WHITE)
                  nameRow.setPadding(dp(10), dp(7), dp(10), 0)
                  b.addView(nameRow)

                  val hasImage = d.getBoolean("hasImage") == true
                  if (hasImage) {
                      val iv = ImageView(this)
                      iv.adjustViewBounds = true
                      iv.scaleType = ImageView.ScaleType.FIT_CENTER
                      iv.setBackgroundColor(Color.parseColor("#EEF1F4"))
                      iv.minimumHeight = dp(140)
                      val ip = LinearLayout.LayoutParams(maxW, -2)
                      ip.topMargin = dp(6)
                      b.addView(iv, ip)
                      loadImage(sid, d.id, iv)
                      iv.setOnClickListener { imageCache[d.id]?.let { showFullImage(it) } }
                  }

                  val text = d.getString("text") ?: ""
                  if (text.isNotBlank()) {
                      val t = tv(text, 15.5f, TXT)
                      t.setLineSpacing(0f, 1.2f)
                      t.maxWidth = maxW - dp(20)
                      t.setPadding(dp(10), dp(4), dp(10), dp(2))
                      t.setTextIsSelectable(false)
                      b.addView(t)
                  }

                  val meta = hbox()
                  meta.layoutDirection = View.LAYOUT_DIRECTION_LTR
                  meta.setPadding(dp(10), dp(2), dp(10), dp(6))
                  val edited = if (d.getBoolean("edited") == true) "معدّلة · " else ""
                  meta.addView(tv(edited + clock(timeOf(d)), 12f, TIME))
                  val views = d.getLong("views") ?: 0L
                  val vv = tv("   👁 $views", 12f, TIME)
                  meta.addView(vv)
                  b.addView(meta)

                  val bp = LinearLayout.LayoutParams(-2, -2)
                  b.minimumWidth = dp(130)
                  wrap.addView(b, bp)

                  b.setOnLongClickListener {
                      postMenu(sid, d)
                      true
                  }
                  val wp = mw(top = 3, bottom = 3)
                  wrap.layoutParams = wp
                  return wrap
              }

              private fun loadImage(sid: String, pid: String, iv: ImageView) {
                  val cached = imageCache[pid]
                  if (cached != null) {
                      iv.setImageBitmap(cached)
                      return
                  }
                  db.collection("sections").document(sid).collection("images").document(pid).get()
                      .addOnSuccessListener { snap ->
                          val bytes = snap.getBlob("data")?.toBytes() ?: return@addOnSuccessListener
                          val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size) ?: return@addOnSuccessListener
                          imageCache[pid] = bmp
                          iv.setImageBitmap(bmp)
                      }
              }

              private fun showFullImage(bmp: Bitmap) {
                  val dlg = Dialog(this, android.R.style.Theme_Black_NoTitleBar_Fullscreen)
                  val iv = ImageView(this)
                  iv.setImageBitmap(bmp)
                  iv.scaleType = ImageView.ScaleType.FIT_CENTER
                  iv.setBackgroundColor(Color.BLACK)
                  iv.setOnClickListener { dlg.dismiss() }
                  dlg.setContentView(iv)
                  dlg.show()
              }

              private fun postMenu(sid: String, d: DocumentSnapshot) {
                  val text = d.getString("text") ?: ""
                  if (!isStaff) {
                      if (text.isNotBlank()) copyText(text)
                      return
                  }
                  val views = d.getLong("views") ?: 0L
                  val options = arrayOf("👁 شاهدها $views", "📌 تثبيت", "✏️ تعديل", "📋 نسخ النص", "🗑️ حذف")
                  AlertDialog.Builder(this).setItems(options) { _, which ->
                      when (which) {
                          0 -> toast("شاهد هذه الرسالة $views من الأعضاء")
                          1 -> db.collection("sections").document(sid)
                              .set(mapOf("pinText" to (if (text.isBlank()) "📷 صورة" else text.take(150)), "pinId" to d.id), SetOptions.merge())
                              .addOnSuccessListener { toast("تم تثبيت الرسالة") }
                          2 -> editPost(d)
                          3 -> copyText(text)
                          4 -> AlertDialog.Builder(this)
                              .setMessage("حذف هذه الرسالة من الشعبة؟")
                              .setPositiveButton("حذف") { _, _ ->
                                  val batch = db.batch()
                                  batch.delete(d.reference)
                                  if (d.getBoolean("hasImage") == true) {
                                      batch.delete(db.collection("sections").document(sid).collection("images").document(d.id))
                                  }
                                  batch.commit().addOnFailureListener { e -> toast("فشل الحذف: " + (e.message ?: "")) }
                              }
                              .setNegativeButton("إلغاء", null)
                              .show()
                      }
                  }.show()
              }

              private fun editPost(d: DocumentSnapshot) {
                  val input = EditText(this)
                  input.setText(d.getString("text") ?: "")
                  input.setPadding(dp(18), dp(12), dp(18), dp(12))
                  AlertDialog.Builder(this)
                      .setTitle("تعديل الرسالة")
                      .setView(input)
                      .setPositiveButton("حفظ") { _, _ ->
                          d.reference.update(mapOf("text" to input.text.toString().trim(), "edited" to true))
                              .addOnFailureListener { e -> toast("فشل التعديل: " + (e.message ?: "")) }
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

