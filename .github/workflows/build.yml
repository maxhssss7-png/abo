        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Decode signing key
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/abufatima.jks"

      - name: Build APK
        env:
          KS_PATH: ${{ runner.temp }}/abufatima.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk abufatima.apk

      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: أستاذ حيدر ${{ github.run_number }}
          files: abufatima.apk
