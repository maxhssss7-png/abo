                      for ((g, c) in chipViews) {
                          if (g == selected) {
                              c.background = shape(GRADE_LIGHT[g] ?: LINE, 12, GRADE_COLOR[g] ?: INK, 2)
                              c.setTextColor(GRADE_COLOR[g] ?: INK)
                          } else {
