          package com.abufatima.app

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import androidx.work.Constraints
          import androidx.work.ExistingPeriodicWorkPolicy
          import androidx.work.NetworkType
          import androidx.work.PeriodicWorkRequestBuilder
          import androidx.work.WorkManager
          import androidx.work.Worker
          import androidx.work.WorkerParameters
          import com.google.android.gms.tasks.Tasks
          import com.google.firebase.auth.FirebaseAuth
          import com.google.firebase.firestore.FirebaseFirestore
          import com.google.firebase.firestore.Query
          import com.google.firebase.firestore.Source
          import java.util.concurrent.TimeUnit

          class PostsWorker(context: Context, params: WorkerParameters) : Worker(context, params) {

              companion object {
                  const val CHANNEL = "homework"

                  fun schedule(context: Context) {
                      val req = PeriodicWorkRequestBuilder<PostsWorker>(15, TimeUnit.MINUTES)
                          .setConstraints(Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build())
                          .build()
                      WorkManager.getInstance(context)
                          .enqueueUniquePeriodicWork("posts-check", ExistingPeriodicWorkPolicy.KEEP, req)
                  }

                  fun ensureChannel(context: Context) {
                      if (Build.VERSION.SDK_INT >= 26) {
                          val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                          if (nm.getNotificationChannel(CHANNEL) == null) {
                              nm.createNotificationChannel(
                                  NotificationChannel(CHANNEL, "الواجبات الجديدة", NotificationManager.IMPORTANCE_HIGH)
                              )
                          }
                      }
                  }
              }

              override fun doWork(): Result {
                  val ctx = applicationContext
                  val prefs = Fb.prefs(ctx)
                  if (prefs.getBoolean("staff", false)) return Result.success()
                  if (prefs.getBoolean("mute_all", false)) return Result.success()
                  val sid = prefs.getString("section", null) ?: return Result.success()
                  if (prefs.getBoolean("mute_$sid", false)) return Result.success()
                  val sec = Fb.section(sid) ?: return Result.success()

                  return try {
                      val app = Fb.app(ctx)
                      if (FirebaseAuth.getInstance(app).currentUser == null) return Result.success()
                      val db = FirebaseFirestore.getInstance(app)
                      val snap = Tasks.await(
                          db.collection("sections").document(sid).collection("posts")
                              .orderBy("createdAt", Query.Direction.DESCENDING)
                              .limit(10)
                              .get(Source.SERVER),
                          30, TimeUnit.SECONDS
                      )
                      val key = "notified_$sid"
                      val last = prefs.getLong(key, 0L)
                      val lastRead = prefs.getLong("read_$sid", 0L)
                      if (last == 0L) {
                          prefs.edit().putLong(key, System.currentTimeMillis()).apply()
                          return Result.success()
                      }
                      val fresh = snap.documents.filter {
                          val t = it.getTimestamp("createdAt")?.toDate()?.time ?: 0L
                          t > last && t > lastRead
                      }
                      if (fresh.isNotEmpty()) {
                          val newest = fresh.maxOf { it.getTimestamp("createdAt")?.toDate()?.time ?: 0L }
                          prefs.edit().putLong(key, newest).apply()
                          val first = fresh.first()
                          val text = first.getString("text")?.takeIf { it.isNotBlank() } ?: "📷 صورة"
                          val title = if (fresh.size == 1) "واجب جديد · ${sec.name}" else "${fresh.size} واجبات جديدة · ${sec.name}"
                          notify(ctx, title, text)
                      }
                      Result.success()
                  } catch (e: Exception) {
                      Result.retry()
                  }
              }

              private fun notify(ctx: Context, title: String, text: String) {
                  ensureChannel(ctx)
                  val open = Intent(ctx, MainActivity::class.java)
                  open.flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  val flags = if (Build.VERSION.SDK_INT >= 23) PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT else PendingIntent.FLAG_UPDATE_CURRENT
                  val pi = PendingIntent.getActivity(ctx, 1, open, flags)
                  val n = NotificationCompat.Builder(ctx, CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_dialog_email)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(text))
                      .setAutoCancel(true)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setContentIntent(pi)
                      .build()
                  try {
                      NotificationManagerCompat.from(ctx).notify(1001, n)
                  } catch (e: SecurityException) {
                      // notification permission not granted
                  }
              }
          }
          EOF

