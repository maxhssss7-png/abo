              // chat list
              // ============================================================

              private fun timeOf(d: DocumentSnapshot): Long = d.getTimestamp("createdAt")?.toDate()?.time ?: System.currentTimeMillis()

              private fun clock(ms: Long): String = SimpleDateFormat("h:mm a", Locale("ar")).format(Date(ms))

              private fun dayLabel(ms: Long): String {
                  val c = Calendar.getInstance()
                  val today = Calendar.getInstance()
                  c.timeInMillis = ms
                  if (c.get(Calendar.YEAR) == today.get(Calendar.YEAR) && c.get(Calendar.DAY_OF_YEAR) == today.get(Calendar.DAY_OF_YEAR)) return "اليوم"
                  today.add(Calendar.DAY_OF_YEAR, -1)
                  if (c.get(Calendar.YEAR) == today.get(Calendar.YEAR) && c.get(Calendar.DAY_OF_YEAR) == today.get(Calendar.DAY_OF_YEAR)) return "أمس"
                  return SimpleDateFormat("d MMMM", Locale("ar")).format(Date(ms))
              }

              private fun listTime(ms: Long): String {
                  val d = dayLabel(ms)
                  return if (d == "اليوم") clock(ms) else d
              }

              private fun showList() {
                  val pg = page()
                  pg.addView(topBar(Fb.APP_NAME, null))
                  val list = vbox()
                  pg.addView(scroller(list), fill())

                  fun render() {
                      list.removeAllViews()
                      for (s in visibleSections()) {
                          val items = posts[s.id] ?: emptyList()
                          val last = items.lastOrNull()
                          val read = prefs.getLong("read_${s.id}", 0L)
                          val unread = if (isStaff) 0 else items.count { timeOf(it) > read }

                          val row = hbox()
                          row.setPadding(dp(14), dp(8), dp(14), dp(8))
                          row.addView(sectionAvatar(s, 54))
                          val col = vbox()
                          val cp = weighted()
                          cp.marginStart = dp(12)
                          col.layoutParams = cp

                          val l1 = hbox()
                          val nm = tv("📢 " + s.name, 16f, TXT, true)
                          nm.setSingleLine(true)
                          nm.layoutParams = weighted()
                          l1.addView(nm)
                          if (last != null) l1.addView(tv(listTime(timeOf(last)), 12.5f, SUB))
                          col.addView(l1)

                          val l2 = hbox()
                          val prevText = when {
                              last == null -> "لا توجد رسائل بعد"
                              last.getBoolean("hasImage") == true -> "📷 " + (last.getString("text")?.takeIf { it.isNotBlank() } ?: "صورة")
                              else -> last.getString("text") ?: ""
                          }
                          val pv = tv(prevText.replace('\n', ' '), 14.5f, SUB)
                          pv.setSingleLine(true)
                          pv.ellipsize = TextUtils.TruncateAt.END
                          pv.layoutParams = weighted()
                          l2.addView(pv)
                          if (unread > 0) {
                              val muted = prefs.getBoolean("mute_${s.id}", false) || prefs.getBoolean("mute_all", false)
                              val b = tv(unread.toString(), 12.5f, Color.WHITE, true)
                              b.gravity = Gravity.CENTER
                              b.minWidth = dp(22)
                              b.setPadding(dp(6), 0, dp(6), 0)
                              b.background = shape(if (muted) Color.parseColor("#B8C1CA") else BADGE, 11)
                              val bp = LinearLayout.LayoutParams(-2, dp(22))
                              bp.marginStart = dp(6)
                              l2.addView(b, bp)
                          }
                          col.addView(l2, mw(top = 3))
                          row.addView(col)
                          row.setOnClickListener { openChat(s.id) }
                          list.addView(row)
                          val dv = divider()
                          val dpar = LinearLayout.LayoutParams(-1, 1)
                          dpar.marginStart = dp(80)
                          list.addView(dv, dpar)
                      }
                      if (!isStaff) {
                          val n = tv("تصلك هنا واجبات شعبتك فقط", 13f, SUB)
                          n.gravity = Gravity.CENTER
                          n.setPadding(0, dp(18), 0, dp(18))
                          list.addView(n, mw())
                      }
                  }
                  render()
                  setScreen(pg, null, { render() }, { render() })
              }

