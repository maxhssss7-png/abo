              private fun openDrawer() {
                  if (drawerOpen) return
                  drawerOpen = true
                  val scrim = View(this)
                  scrim.setBackgroundColor(Color.parseColor("#66000000"))
                  scrim.tag = "scrim"
                  scrim.setOnClickListener { closeDrawer() }
                  rootFrame.addView(scrim, FrameLayout.LayoutParams(-1, -1))

                  val w = minOf((screenW * 0.82f).toInt(), dp(330))
                  val panel = vbox()
                  panel.tag = "drawer"
                  panel.setBackgroundColor(Color.WHITE)
                  panel.elevation = dpf(12)
                  panel.isClickable = true

                  val head = vbox()
                  head.setBackgroundColor(HEAD)
                  head.setPadding(dp(18), dp(24), dp(18), dp(14))
                  head.addView(teacherAvatar(64))
                  head.addView(nameWithBadge(16f, Color.WHITE, Color.WHITE, HEAD), mw(top = 14))
                  val sub = if (isStaff) "كل الشعب" else (Fb.section(mySection)?.name ?: "")
                  head.addView(tv(sub, 13.5f, HEADSUB), mw(top = 2))
                  panel.addView(head)

                  fun item(icon: String, text: String, action: () -> Unit) {
                      val r = hbox()
                      r.setPadding(dp(20), dp(14), dp(20), dp(14))
                      val ic = tv(icon, 19f, SUB)
                      ic.layoutParams = LinearLayout.LayoutParams(dp(30), -2)
                      r.addView(ic)
                      val t = tv(text, 15.5f, TXT)
                      val tp = weighted()
                      tp.marginStart = dp(20)
                      t.layoutParams = tp
                      r.addView(t)
                      r.setOnClickListener {
                          closeDrawer()
                          action()
                      }
                      panel.addView(r)
                  }
                  item("👤", profName) { showProfile() }
                  item("📤", "مشاركة التطبيق") { shareApp() }
                  item("⚙️", "الإعدادات") { showSettings() }
                  if (!isStaff) item("🔄", "تغيير الشعبة") { showPick() }
                  if (isStaff) {
                      val dv = divider()
                      val dvp = LinearLayout.LayoutParams(-1, 1)
                      dvp.topMargin = dp(6)
                      dvp.bottomMargin = dp(6)
                      panel.addView(dv, dvp)
                      item("✏️", "تعديل الملف الشخصي") { showEditProfile() }
                  }
                  if (isDev) item("🔑", "صلاحيات الأساتذة") { showGrant() }

                  val spacer = View(this)
                  panel.addView(spacer, fill())
                  val ver = tv(Fb.APP_NAME + " · الإصدار " + versionName(), 12.5f, SUB)
                  ver.setPadding(dp(20), dp(14), dp(20), dp(14))
                  panel.addView(ver)

                  val lp = FrameLayout.LayoutParams(w, -1)
                  lp.gravity = Gravity.START
                  rootFrame.addView(panel, lp)
                  panel.translationX = w.toFloat()
                  panel.animate().translationX(0f).setDuration(200).start()
              }

              private fun closeDrawer() {
                  drawerOpen = false
                  val toRemove = mutableListOf<View>()
                  for (i in 0 until rootFrame.childCount) {
                      val v = rootFrame.getChildAt(i)
                      if (v.tag == "scrim" || v.tag == "drawer") toRemove.add(v)
                  }
                  for (v in toRemove) rootFrame.removeView(v)
              }

              private fun versionName(): String = try {
                  packageManager.getPackageInfo(packageName, 0).versionName ?: ""
              } catch (e: Exception) {
                  ""
              }

