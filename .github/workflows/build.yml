name: Build Abu Fatima

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/abufatima/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace 'com.abufatima.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.abufatima.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "0.2"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_PATH"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias "abufatima"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="ابو فاطمة"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/abufatima/app/MainActivity.kt <<'EOF'
          package com.abufatima.app

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.graphics.Typeface
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import java.util.UUID

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val androidId = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)
                  val deviceId = (androidId ?: UUID.randomUUID().toString()).take(8).uppercase()

                  val padding = (24 * resources.displayMetrics.density).toInt()

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(padding, padding * 2, padding, padding)
                  root.gravity = Gravity.CENTER_HORIZONTAL

                  val title = TextView(this)
                  title.text = "ابو فاطمة"
                  title.textSize = 22f
                  title.setTypeface(null, Typeface.BOLD)
                  title.gravity = Gravity.CENTER

                  val sub = TextView(this)
                  sub.text = "هذا معرّف جهازك. انسخه وارسله للمطوّر حتى يفعّل حسابك."
                  sub.textSize = 14f
                  sub.gravity = Gravity.CENTER
                  sub.setPadding(0, padding / 2, 0, padding)

                  val idView = TextView(this)
                  idView.text = deviceId
                  idView.textSize = 20f
                  idView.setTypeface(Typeface.MONOSPACE, Typeface.BOLD)
                  idView.gravity = Gravity.CENTER
                  idView.setPadding(padding, padding, padding, padding)
                  idView.setTextIsSelectable(true)

                  val copyBtn = Button(this)
                  copyBtn.text = "نسخ المعرّف"
                  copyBtn.setOnClickListener {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("device_id", deviceId))
                      Toast.makeText(this, "تم النسخ", Toast.LENGTH_SHORT).show()
                  }

                  root.addView(title)
                  root.addView(sub)
                  root.addView(idView)
                  val btnParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )
                  btnParams.topMargin = padding
                  btnParams.gravity = Gravity.CENTER_HORIZONTAL
                  root.addView(copyBtn, btnParams)

                  setContentView(root)
              }
          }
          EOF

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Decode signing key
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/abufatima.jks"

      - name: Build APK
        env:
          KS_PATH: ${{ runner.temp }}/abufatima.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk abufatima.apk

      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ابو فاطمة ${{ github.run_number }}
          files: abufatima.apk
